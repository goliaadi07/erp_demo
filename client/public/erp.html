async function submitAddBatch(){
  const meters=parseFloat(document.getElementById('f_meters').value)||0;
  const rate=parseFloat(document.getElementById('f_rate').value)||0;
  const saveBtn = document.querySelector('#modalRoot .btn-primary, .modal-foot .btn-primary');
  if(saveBtn){ saveBtn.disabled = true; saveBtn.textContent = tr('Saving…') || 'Saving…'; }
  const payload={
    clothName: document.getElementById('f_cloth').value || 'Unnamed Cloth',
    supplier: (document.getElementById('f_supplier').value||'').trim() || 'Unknown',
    purchaseDate: document.getElementById('f_date').value,
    billNo: document.getElementById('f_bill').value || '—',
    pcs: parseFloat(document.getElementById('f_pcs').value)||0,
    meters, ratePerMeter: rate,
    paidAmount: parseFloat(document.getElementById('f_paid').value)||0,
    imageDataUrl: pendingBatchImage,
  };
  // Re-request token from parent (iframe may not share sessionStorage)
  try{ if(window.parent && window.parent!==window) window.parent.postMessage({type:'threadline-auth-request'}, '*'); }catch(e){}
  for(let i=0;i<10 && !readAuthToken();i++){ await new Promise(r=>setTimeout(r,30)); }
  if(!readAuthToken()){
    if(saveBtn){ saveBtn.disabled = false; saveBtn.textContent = tr('Save Purchase'); }
    toast(tr('Please sign in again to save raw material.'));
    return;
  }
  try{
    const data=await api('/api/batches',{method:'POST', body:JSON.stringify(payload)});
    const b=data.batch;
    if(!SUPPLIERS.includes(b.supplier)) SUPPLIERS.push(b.supplier);
    // Replace any optimistic local row with the persisted one
    state.batches = state.batches.filter(x=>x.id!==b.id);
    state.batches.push({
      id:b.id, clothName:b.clothName, supplier:b.supplier, purchaseDate:b.purchaseDate,
      billNo:b.billNo, pcs:b.pcs, meters:b.meters, ratePerMeter:b.ratePerMeter,
      amount:b.amount, paidAmount:b.paidAmount,
      pendingAmount:b.pendingAmount!=null?b.pendingAmount:(b.amount-(b.paidAmount||0)),
      distributedM:b.distributedM||0, imageUrl:b.imageUrl||null,
    });
    const num=parseInt(String(b.id).replace(/\D/g,''),10);
    if(!isNaN(num) && num>state.seq.batch) state.seq.batch=num;
    pendingBatchImage = null;
    closeModal();
    toast(L('Batch '+b.id+' saved to database — '+meters+' M added', 'बॅच '+b.id+' जतन झाली — '+meters+' M जोडले'));
    render();
  }catch(err){
    if(saveBtn){ saveBtn.disabled = false; saveBtn.textContent = tr('Save Purchase'); }
    console.error('save batch failed', err);
    toast(tr('Could not save raw material')+': '+err.message);
  }
}

let EMP_DEPT_FILTER = null;
// Vendors take raw cloth like the cutting floor (see isCuttingOrVendor), so they are grouped under Cutting.
function empFilterDept(e){ return (e.type==='vendor' || e.dept==='vendor') ? (e.workDept || 'cutting') : e.dept; }

function toggleEmpDept(id){ EMP_DEPT_FILTER = EMP_DEPT_FILTER===id ? null : id; render(); }
function viewEmployees(){
  const shown = EMP_DEPT_FILTER ? state.employees.filter(e=>empFilterDept(e)===EMP_DEPT_FILTER) : state.employees;
  const cards = shown.map(e=>{
    const t = empTotals(e.id);
    const list = empAssignments(e.id);

    return `<div class="emp-card" onclick="route('emp-${e.id}')">

        <div class="emp-avatar">${initials(e.name)}</div>
        <div>
          <div class="emp-name">${e.name}</div>

        </div>
      </div>
      <div class="emp-stats">
        <div class="emp-stat"><div class="l">${tr('Active jobs')}</div><div class="v">${active}</div></div>
        <div class="emp-stat"><div class="l">${tr('Total earned')}</div><div class="v">${inr(t.earned)}</div></div>
        <div class="emp-stat"><div class="l">${tr('Paid')}</div><div class="v">${inr(t.paid)}</div></div>
        <div class="emp-stat"><div class="l">${tr('Pending')}</div><div class="v" style="color:${t.pending>0?'var(--amber)':'var(--green)'}">${inr(t.pending)}</div></div>

      : `${state.employees.length} ${tr('accounts · internal workforce and outsourced vendors')}`}</p></div>
    <button class="btn btn-primary" onclick="openAddEmployeeModal()">${tr('＋ Add Employee')}</button>

  <div class="pill-nav dept-chips" role="group" aria-label="${L('Filter by department','विभागानुसार निवडा')}">
    ${DEPTS.map(d=>{ const n=state.employees.filter(e=>empFilterDept(e)===d.id).length; const on=EMP_DEPT_FILTER===d.id;
      return `<button type="button" class="pill dept-chip ${on?'active':''}" aria-pressed="${on}" onclick="toggleEmpDept('${d.id}')"><span aria-hidden="true">${d.icon}</span> ${empDeptChipLabel(d.id)} <span class="chip-count">${n}</span></button>`; }).join('')}
  </div>
  <div class="card-grid">${cards || `<div class="panel panel-pad empty" style="grid-column:1/-1">${L('No one in this department yet.','या विभागात अजून कोणी नाही.')}</div>`}</div>`;

function openAddEmployeeModal(){
  openModal(`
    <div class="modal-head"><h3>${tr('Add Employee / Vendor')}</h3><span class="modal-close" onclick="closeModal()">✕</span></div>
    <div class="modal-body">
      <div class="field"><label>${tr('Full Name')}</label><input id="f_name" placeholder="e.g. Vikram"></div>
      <div class="field"><label>${tr('Type')}</label>
        <select id="f_type" onchange="document.getElementById('deptField').style.display=this.value==='vendor'?'none':'block'">

          <option value="vendor">${tr('Vendor')}</option>
        </select>
      </div>
      <div class="field" id="deptField"><label>${tr('Department')}</label>
        <select id="f_dept">${DEPTS.map(d=>`<option value="${d.id}">${deptName(d.id)}</option>`).join('')}</select>

      <button class="btn btn-primary" onclick="submitAddEmployee()">${tr('Create Account')}</button></div>
  `);
}
function submitAddEmployee(){
  const type = document.getElementById('f_type').value;
  const dept = type==='vendor' ? 'vendor' : document.getElementById('f_dept').value;
  const prefix = type==='vendor' ? 'VEN' : 'EMP-'+dept.slice(0,3).toUpperCase();
  const count = state.employees.filter(e=> type==='vendor'? e.type==='vendor' : e.dept===dept).length + 1;
  const id = type==='vendor' ? `VEN-${String(count).padStart(3,'0')}` : `${prefix}-${String(count).padStart(3,'0')}`;
  state.employees.push({id, name: document.getElementById('f_name').value || 'New Employee', dept, type, active:true});
  closeModal();
  toast(L(`Account ${id} created`, `खाते ${id} तयार झाले`));
  route('employees');
}

    <p style="font-size:13px;margin-bottom:12px;">${tr('You have')} <b>${activeJob.qtyIn} ${activeJob.unitIn==='meters'?'M':'pcs'} ${tr('of')} ${itemName(activeJob.item)}</b> ${tr('assigned for')} <b>${deptName(activeJob.dept)}</b> · ${tr('Batch')} ${activeJob.batchId}</p>

function openSubmitProductionModal(assignId){
  const a = state.assignments.find(x=>x.id===assignId);
  const item = ITEMS.find(i=>i.id===a.item);
  const isCuttingOrVendor = a.dept==='cutting' || a.dept==='vendor';
  const suggestedUse = isCuttingOrVendor ? (a.qtyIn * 0.85).toFixed(1) : null;
  openModal(`
    <div class="modal-head"><h3>${tr('Submit Completed Work')}</h3><span class="modal-close" onclick="closeModal()">✕</span></div>
    <div class="modal-body">
      <p class="hint" style="margin-bottom:14px;">${tr('Assignment:')} ${a.qtyIn} ${a.unitIn==='meters'?'M':'pcs'} ${tr('of')} ${itemName(a.item)} · ${deptName(a.dept)} · ${tr('Batch')} ${a.batchId}</p>
      ${isCuttingOrVendor ? `<div class="field"><label>${tr('Material Used (Meters)')}</label><input type="number" id="f_used" value="${suggestedUse}"><div class="hint">${L(`Suggested from ${item.clothPerPc} M/piece average — edit to actual.`, `सरासरी ${item.clothPerPc} M/नग वरून सुचवलेले — प्रत्यक्ष आकडा लिहा.`)}</div></div>` : ''}
      <div class="field"><label>${tr('Pieces Completed')}</label><input type="number" id="f_pieces" value="${isCuttingOrVendor? Math.round(a.qtyIn/item.clothPerPc*0.9) : a.qtyIn}"></div>
      <div class="hint">${tr('Earnings = pieces × rate. Current rate for')} ${itemName(a.item)} ${tr('in')} ${deptName(a.dept)}: ₹${a.dept==='vendor'?item.vendorRate:item.rates[a.dept]}/pc.</div>
    </div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">${tr('Cancel')}</button>
      <button class="btn btn-primary" onclick="confirmSubmitProduction('${assignId}', ${isCuttingOrVendor})">${tr('Save & Calculate Earnings')}</button></div>
  `);
}
function confirmSubmitProduction(assignId, hasMaterial){
  const pieces = parseInt(document.getElementById('f_pieces').value)||0;
  const used = hasMaterial ? parseFloat(document.getElementById('f_used').value)||0 : null;
  submitProduction(assignId, used, pieces);
  const a = state.assignments.find(x=>x.id===assignId);
  closeModal();
  toast(L(`Saved — ${pieces} pcs logged, ${inr(a.earnings)} earned`, `जतन झाले — ${pieces} नग नोंदवले, ${inr(a.earnings)} कमाई`));
  render();
}
function openForwardModal(assignId){
  const a = state.assignments.find(x=>x.id===assignId);
  const nextDeptId = DEPTS.find(d=>d.id===a.dept).next;
  const options = state.employees.filter(e=>e.dept===nextDeptId);
  openModal(`
    <div class="modal-head"><h3>${tr('Forward to')} ${deptName(nextDeptId)}</h3><span class="modal-close" onclick="closeModal()">✕</span></div>
    <div class="modal-body">
      <div class="field"><label>${tr('Send to employee')}</label>
        <select id="f_toEmp">${options.map(o=>`<option value="${o.id}">${o.name}</option>`).join('')}</select>
      </div>
      <div class="field"><label>${tr('Quantity (pieces)')}</label><input type="number" id="f_qty" value="${a.piecesProduced}"></div>
    </div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">${tr('Cancel')}</button>
      <button class="btn btn-primary" onclick="confirmForward('${assignId}')">${tr('Forward')}</button></div>
  `);
}
function confirmForward(assignId){
  const toEmp = document.getElementById('f_toEmp').value;
  const qty = parseInt(document.getElementById('f_qty').value)||0;
  const next = forwardAssignment(assignId, toEmp, qty);
  closeModal();
  toast(L(`Forwarded ${qty} pcs to ${state.employees.find(e=>e.id===toEmp).name}`, `${qty} नग ${state.employees.find(e=>e.id===toEmp).name} यांच्याकडे पाठवले`));
  render();
}

function openAssignModal(){
  const batchOptions = state.batches.map(b=>`<option value="${b.id}">${b.id} — ${b.clothName} (${batchRemaining(b)} M avail.)</option>`).join('');
  openModal(`
    <div class="modal-head"><h3>${tr('Assign Work ')}</h3><span class="modal-close" onclick="closeModal()">✕</span></div>
    <div class="modal-body">
      <div class="field"><label>${tr('Assign to')}</label>
        <select id="f_emp" onchange="onAssignEmpChange()">${state.employees.filter(e=>e.dept==='cutting'||e.dept==='vendor').map(e=>`<option value="${e.id}">${e.name} — ${e.type==='vendor'?tr('Vendor'):deptName(e.dept)}</option>`).join('')}</select>
        <div class="hint">${tr('New work always starts at Cutting (internal chain) or goes straight to a Vendor.')}</div>
      </div>
      <div class="field"><label>${tr('Cloth Batch')}</label><select id="f_batch">${batchOptions}</select></div>
      <div class="field-row">
        <div class="field"><label>${tr('Item')}</label><select id="f_item">${ITEMS.map(i=>`<option value="${i.id}">${itemName(i.id)}</option>`).join('')}</select></div>
        <div class="field"><label>${tr('Meters to Give')}</label><input type="number" id="f_qty" value="50"></div>
      </div>
    </div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">${tr('Cancel')}</button>
      <button class="btn btn-primary" onclick="submitAssign()">${tr('Assign')}</button></div>
  `);
}
function submitAssign(){
  const empId = document.getElementById('f_emp').value;
  const emp = state.employees.find(e=>e.id===empId);
  const batchId = document.getElementById('f_batch').value;
  const b = state.batches.find(x=>x.id===batchId);
  const qty = parseFloat(document.getElementById('f_qty').value)||0;
  if(qty > batchRemaining(b)){ toast(L(`Only ${batchRemaining(b)} M available in ${batchId}`, `${batchId} मध्ये फक्त ${batchRemaining(b)} M उपलब्ध`)); return; }
  createAssignment({batchId, item:document.getElementById('f_item').value, dept: emp.type==='vendor'?'vendor':'cutting', employeeId:empId, qtyIn:qty, unitIn:'meters'});
  closeModal();
  toast(L(`Assigned ${qty} M to ${emp.name}`, `${emp.name} यांना ${qty} M दिले`));
  render();
}

function viewProductionPipeline(){
  const stages = DEPTS.map(d=>{

      <div class="strip-card"><div class="l">${tr('Active vendor jobs')}</div><div class="v">${vst.pendingCount}</div></div>

/* ============================================================
   VIEW: DEPARTMENT
============================================================ */
function viewDepartment(deptId){
  const dept = DEPTS.find(d=>d.id===deptId);
  if(!dept) return '<div class="empty">Department not found.</div>';
  const employees = state.employees.filter(e=>e.dept===deptId);
  const list = state.assignments.filter(a=>a.dept===deptId).slice().reverse();
  const isClothIntake = deptId==='cutting'; // this stage receives raw cloth in meters, not finished pieces
  const et = tr;

  const rows = list.map(a=>{
    const emp = state.employees.find(e=>e.id===a.employeeId);
    const statusBadge = a.status==='in-progress' ? `<span class="badge badge-sky">${et('In progress')}</span>`
      : a.status==='forwarded' ? `<span class="badge badge-grey">${et('Forwarded')}</span>`
      : a.status==='ready' ? `<span class="badge badge-green">${et('Ready')}</span>`
      : `<span class="badge badge-amber">${et('Completed — not forwarded')}</span>`;
    let action = '';
    if(a.status==='in-progress') action = `<button class="btn btn-ghost btn-sm" onclick="openSubmitProductionModal('${a.id}')">${et('Submit')}</button>`;
    else if(a.status==='completed' && dept.next) action = `<button class="btn btn-ghost btn-sm" onclick="openForwardModal('${a.id}')">${et('Forward')}</button>`;
    else if(a.status==='completed' && !dept.next) action = `<button class="btn btn-ghost btn-sm" onclick="markReady('${a.id}');render();toast(tr('Marked ready for delivery'))">${et('Mark Ready')}</button>`;

    if(isClothIntake){
      const used = a.materialUsed;
      const remaining = used!=null ? Math.max(0, +(a.qtyIn - used).toFixed(1)) : null;
      const avg = (used!=null && a.piecesProduced) ? (used/a.piecesProduced).toFixed(2) : '—';
      let submitCell = '—';
      if(remaining!=null){
        if(remaining<=0) submitCell = `<span class="badge badge-grey">—</span>`;
        else if(a.materialReturned) submitCell = `<span class="badge badge-green">✓ ${et('Submitted')}</span>`;
        else submitCell = `<button class="btn btn-danger-ghost btn-tiny" onclick="toggleMaterialReturn('${a.id}')">${et('Submit Cloth')}</button>`;
      }
      return `<tr>
        <td onclick="route('emp-${emp.id}')" class="row-click"><span class="tbl-name">${emp.name}</span></td>
        <td>${itemName(a.item)}</td>
        <td class="mono tbl-sub">${a.batchId}</td>
        <td>${a.qtyIn} M</td>
        <td>${used!=null? used+' M' : '—'}</td>
        <td>${avg}${avg!=='—'?' M':''}</td>
        <td>${remaining!=null? remaining+' M' : '—'}</td>
        <td>${submitCell}</td>
        <td>${a.piecesProduced??'—'}</td>
        <td>${inr(a.earnings||0)}</td>
        <td>${statusBadge}</td>
        <td>${action}</td>
      </tr>`;
    }
    return `<tr>
      <td onclick="route('emp-${emp.id}')" class="row-click"><span class="tbl-name">${emp.name}</span></td>
      <td>${itemName(a.item)}</td>
      <td class="mono tbl-sub">${a.batchId}</td>
      <td>${a.qtyIn} ${a.unitIn==='meters'?'M':'pcs'}</td>
      <td>${a.piecesProduced??'—'}</td>
      <td>${inr(a.earnings||0)}</td>
      <td>${fmtDate(a.dateAssigned)}</td>
      <td>${statusBadge}</td>
      <td>${action}</td>
    </tr>`;
  }).join('');

  const st = deptStats(deptId);
  return `
  <div class="page-head">
    <div><h1 class="page-title">${dept.icon} ${deptName(deptId)}</h1><p class="page-sub">${employees.length} ${et('employees ')} · ${dept.next? et('forwards to')+' '+deptName(dept.next) : et('final stage — ready for delivery')}</p></div>
    <button class="btn btn-primary" onclick="openAssignToDeptModal('${deptId}')">${et('＋ Assign Job')}</button>
  </div>
  <div class="kpi-grid" style="grid-template-columns:repeat(3,1fr);">
    <div class="kpi-card"><div class="kpi-label">${et('Received')}</div><div class="kpi-value">${st.received}</div></div>
    <div class="kpi-card"><div class="kpi-label">${et('Completed')}</div><div class="kpi-value">${st.completed}</div></div>
    <div class="kpi-card"><div class="kpi-label">${et('Active jobs ')}</div><div class="kpi-value">${st.pendingCount}</div></div>
  </div>
  <h2 class="section-title">${et('Team')}</h2>
  <div class="card-grid">${employees.map(e=>{
    const tt = empTotals(e.id);
    return `<div class="emp-card" onclick="route('emp-${e.id}')"><div class="emp-top"><div class="emp-avatar">${initials(e.name)}</div><div><div class="emp-name">${e.name}</div><div class="emp-role mono">${e.id}</div></div></div>
    <div class="emp-stats"><div class="emp-stat"><div class="l">${et('Earned')}</div><div class="v">${inr(tt.earned)}</div></div><div class="emp-stat"><div class="l">${et('Pending')}</div><div class="v">${inr(tt.pending)}</div></div></div></div>`;
  }).join('')}</div>
  <h2 class="section-title">${et('Job log')}</h2>
  <div class="panel"><div style="overflow-x:auto;">
    <table>${isClothIntake ? `
      <tr><th>${et('Employee')}</th><th>${et('Item')}</th><th>${et('Batch')}</th><th>${et('Cloth Given')}</th><th>${et('Cloth Used')}</th><th>${et('Avg / Piece')}</th><th>${et('Cloth Remaining')}</th><th>${et('Cloth Submitted?')}</th><th>${et('Produced')}</th><th>${et('Earned')}</th><th>${et('Status')}</th><th></th></tr>
      ${rows || `<tr><td colspan="12" class="empty">${et('No jobs yet in this department.')}</td></tr>`}
    ` : `
      <tr><th>${et('Employee')}</th><th>${et('Item')}</th><th>${et('Batch')}</th><th>${et('Received')}</th><th>${et('Produced')}</th><th>${et('Earned')}</th><th>${et('Date')}</th><th>${et('Status')}</th><th></th></tr>
      ${rows || `<tr><td colspan="9" class="empty">${et('No jobs yet in this department.')}</td></tr>`}
    `}</table>
  </div></div>`;
}
function openAssignToDeptModal(deptId){
  if(deptId!=='cutting'){ toast(tr('Jobs enter this department automatically when forwarded from the previous stage.')); return; }
  openAssignModal();
}

      <td onclick="route('emp-${e.id}')" class="row-click"><span class="tbl-name">${e.name}</span><br><span class="tbl-sub">${e.id}</span></td>

  }).join('');
  const totalEarned = state.employees.reduce((s,e)=>s+empTotals(e.id).earned,0);

  return `

  <div class="kpi-grid" style="grid-template-columns:repeat(3,1fr);">
    <div class="kpi-card"><div class="kpi-label">${tr('Total Payroll (Earned)')}</div><div class="kpi-value">${inr(totalEarned)}</div></div>
    <div class="kpi-card"><div class="kpi-label">${tr('Paid Out')}</div><div class="kpi-value">${inr(totalPaid)}</div></div>
    <div class="kpi-card"><div class="kpi-label">${tr('Pending')}</div><div class="kpi-value">${inr(totalEarned-totalPaid)}</div></div>
  </div>
  <h2 class="section-title">${tr("This week's ledger")}</h2>
  <div class="panel"><div style="overflow-x:auto;">
    <table><tr><th>${tr('Employee')}</th><th>${tr('Dept / Type')}</th><th>${tr('Pay Type')}</th><th>${tr('Earned')}</th><th>${tr('Paid')}</th><th>${tr('Pending')}</th><th>${tr('Status')}</th><th></th></tr>
    ${rows}</table>
  </div></div>`;
}
function openPayModal(empId){
  const e = state.employees.find(x=>x.id===empId);
  const t = empTotals(empId);
  openModal(`
    <div class="modal-head"><h3>${tr('Settle Payment')} — ${e.name}</h3><span class="modal-close" onclick="closeModal()">✕</span></div>
    <div class="modal-body">
      <p class="hint" style="margin-bottom:12px;">${tr('Earned')} ${inr(t.earned)} · ${tr('Already paid')} ${inr(t.paid)} · ${tr('Pending')} ${inr(t.pending)}</p>
      <div class="field"><label>${tr('Amount to Pay Now (₹)')}</label><input type="number" id="f_amt" value="${t.pending}"></div>
    </div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">${tr('Cancel')}</button>
      <button class="btn btn-primary" onclick="confirmPay('${empId}')">${tr('Confirm Payment')}</button></div>
  `);
}
function confirmPay(empId){
  const amt = parseFloat(document.getElementById('f_amt').value)||0;
  if(!state.payments[empId]) state.payments[empId] = {paid:0};
  state.payments[empId].paid += amt;
  closeModal();
  toast(L(`${inr(amt)} paid to ${state.employees.find(e=>e.id===empId).name}`, `${state.employees.find(e=>e.id===empId).name} यांना ${inr(amt)} दिले`));
  render();
}

/* ============================================================
   VIEW: RATE CARD & PRICING (admin price control)
   Every item's ₹/piece rate, per department + vendor lump-sum.
   Editing here changes what NEW work earns from now on;
   jobs already submitted keep the earnings they were paid at.
============================================================ */
function viewRateCard(){
  const rowsHtml = ITEMS.map(item=>`
    <tr>
      <td><span class="tbl-name">${itemName(item.id)}</span></td>
      ${DEPTS.map(d=>`<td><input class="rate-input" type="number" min="0" step="0.5" id="rate_${item.id}_${d.id}" value="${item.rates[d.id]}"></td>`).join('')}
      <td><input class="rate-input" type="number" min="0" step="0.5" id="rate_${item.id}_vendor" value="${item.vendorRate}"></td>
    </tr>
  `).join('');

  return `
  <div class="page-head">
    <div><h1 class="page-title">${tr('Rate Card')}</h1><p class="page-sub">${tr('Set what each employee earns per piece, by item and by department. Changes apply to work logged from now on.')}</p></div>
    <button class="btn btn-primary" onclick="saveRateCard()">${tr('Save Changes')}</button>
  </div>
  <div class="panel panel-pad">
    <div style="overflow-x:auto;">
      <table class="rate-table">
        <tr>
          <th>${tr('Item')}</th>
          ${DEPTS.map(d=>`<th>${deptName(d.id)}<br><span class="hint">₹ / pc</span></th>`).join('')}
          <th>${tr('Vendor Rate (full making)')}<br><span class="hint">₹ / pc</span></th>
        </tr>
        ${rowsHtml}
      </table>
    </div>
    <div class="rate-note">${tr('Rates saved. New work will be calculated using the updated price list; already-completed jobs keep their original earnings.')}</div>
  </div>`;
}
function saveRateCard(){
  ITEMS.forEach(item=>{
    DEPTS.forEach(d=>{
      const v = parseFloat(document.getElementById(`rate_${item.id}_${d.id}`).value);
      if(!isNaN(v) && v>=0) item.rates[d.id] = v;
    });
    const vv = parseFloat(document.getElementById(`rate_${item.id}_vendor`).value);
    if(!isNaN(vv) && vv>=0) item.vendorRate = vv;
  });
  toast(tr('Rates saved. New work will be calculated using the updated price list; already-completed jobs keep their original earnings.'));
  render();
}

function syncDarkFromStorage(){
  const dark = localStorage.getItem('threadline_dark')==='1' || localStorage.getItem('threadline_erp_dark')==='1';
  document.documentElement.classList.toggle('dark-mode', dark);
  localStorage.setItem('threadline_dark', dark?'1':'0');
  localStorage.setItem('threadline_erp_dark', dark?'1':'0');
  const b=document.getElementById('darkToggle'); if(b) b.textContent=dark?'☀ '+tr('Light'):'☾ '+tr('Dark');
  try{ window.parent && window.parent.postMessage({type:'threadline-theme', dark}, '*'); }catch(e){}
}
function toggleDarkMode(){
  const next = !document.documentElement.classList.contains('dark-mode');
  localStorage.setItem('threadline_dark', next?'1':'0');
  localStorage.setItem('threadline_erp_dark', next?'1':'0');
  syncDarkFromStorage();
}
/* ============================================================
   NOTIFICATIONS — public-website quote requests.
   A request is NEW until the owner opens this page; opening it
   marks those requests seen in the database (seen_at), so the bell
   count drops and next time they are listed under "Earlier / Seen".
============================================================ */
let QUOTE_NEW_COUNT = 0;
let NOTIF = {loaded:false, loading:false, quotes:[], total:0, error:'', sessionNewIds:[]};
function setQuoteCount(n){
  QUOTE_NEW_COUNT = Number(n)||0;
  const c=document.getElementById('quoteBellCount');
  if(c){ c.hidden = !QUOTE_NEW_COUNT; c.textContent = QUOTE_NEW_COUNT>99 ? '99+' : String(QUOTE_NEW_COUNT); }
  const b=document.getElementById('quoteBell');
  if(b){ const l = QUOTE_NEW_COUNT ? `${tr('Notifications')}: ${QUOTE_NEW_COUNT} ${tr('new')}` : tr('Notifications'); b.setAttribute('aria-label', l); b.title = l; }
  document.querySelectorAll('.nav-badge[data-badge="notifications"]').forEach(el=>{ el.hidden = !QUOTE_NEW_COUNT; el.textContent = QUOTE_NEW_COUNT; });
}
async function pollQuoteSummary(){
  if(!readAuthToken()) return;
  try{ const d = await api('/api/quotes/summary'); setQuoteCount(d.newCount||0); }catch(e){}
}
setInterval(()=>{ if(!document.hidden) pollQuoteSummary(); }, 30000);
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) pollQuoteSummary(); });
async function loadNotifications(){
  if(NOTIF.loading) return;
  NOTIF.loading = true;
  if((location.hash||'').slice(1)==='notifications' && !NOTIF.loaded) render();
  try{
    for(let i=0;i<20 && !readAuthToken();i++){ await new Promise(r=>setTimeout(r,50)); }
    const d = await api('/api/quotes');
    const fresh = (d.quotes||[]).filter(q=>q.isNew).map(q=>q.id);
    NOTIF.quotes = d.quotes||[]; NOTIF.total = d.total||0; NOTIF.error = '';
    NOTIF.sessionNewIds = [...new Set([...NOTIF.sessionNewIds, ...fresh])];
    NOTIF.loaded = true;
    if(fresh.length){
      const r = await api('/api/quotes/seen', {method:'POST', body:JSON.stringify({ids:fresh})});
      setQuoteCount(r.newCount||0);
    } else setQuoteCount(d.newCount||0);
  }catch(err){ NOTIF.error = err.message || 'Error'; }
  NOTIF.loading = false;
  if((location.hash||'').slice(1)==='notifications') render();
}
function refreshNotifications(){ loadNotifications(); }
function fmtDateTime(iso){
  if(!iso) return '';
  try{ return new Date(iso).toLocaleString(LANG==='mr'?'mr-IN':'en-IN',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}); }catch(e){ return iso; }
}
function timeAgo(iso){
  if(!iso) return '';
  const s = Math.round((Date.now() - new Date(iso).getTime())/1000);
  if(s < 60) return tr('just now');
  if(s < 3600) return L(`${Math.floor(s/60)} min ago`, `${Math.floor(s/60)} मिनिटांपूर्वी`);
  if(s < 86400) return L(`${Math.floor(s/3600)} h ago`, `${Math.floor(s/3600)} तासांपूर्वी`);
  return L(`${Math.floor(s/86400)} d ago`, `${Math.floor(s/86400)} दिवसांपूर्वी`);
}
function telHref(m){ return 'tel:' + String(m||'').replace(/[^\d+]/g,''); }
function notifCard(q){
  return `<article class="notif-card">
    <div><span class="who">${escHtml(q.firstName)} ${escHtml(q.surname)}</span><span class="new-pill">${tr('New')}</span></div>
    <time datetime="${escHtml(q.createdAt)}" title="${escHtml(fmtDateTime(q.createdAt))}">${timeAgo(q.createdAt)} · ${fmtDateTime(q.createdAt)}</time>
    <div class="notif-meta">
      <span>👕 <b>${tr('Product')}:</b> ${escHtml(q.productName)}</span>
      <span>📞 <a href="${telHref(q.mobile)}" title="${tr('Call')}">${escHtml(q.mobile)}</a></span>
      <span>✉ <a href="mailto:${escHtml(q.email)}" title="${tr('Reply by email')}">${escHtml(q.email)}</a></span>
    </div>
    ${q.message ? `<div class="notif-msg"><b>${tr('Message')}:</b> ${escHtml(q.message)}</div>` : ''}
  </article>`;
}
function viewNotifications(){
  const head = `<div class="page-head">
    <div><h1 class="page-title">${tr('Notifications')}</h1><p class="page-sub">${tr('Quote requests from your website')}</p></div>
    <div class="notif-head-actions"><button class="btn btn-ghost" onclick="refreshNotifications()" ${NOTIF.loading?'disabled':''}>↻ ${tr('Refresh')}</button></div>
  </div>`;
  if(!NOTIF.loaded){
    return head + `<div class="panel notif-empty">${NOTIF.error ? tr('Could not load notifications')+': '+escHtml(NOTIF.error) : tr('Loading…')}</div>`;
  }
  const newOnes = NOTIF.quotes.filter(q=>NOTIF.sessionNewIds.includes(q.id));
  const earlier = NOTIF.quotes.filter(q=>!NOTIF.sessionNewIds.includes(q.id));
  const rows = earlier.map(q=>`<tr>
      <td><span class="tbl-name">${escHtml(q.firstName)} ${escHtml(q.surname)}</span></td>
      <td><a href="${telHref(q.mobile)}">${escHtml(q.mobile)}</a></td>
      <td><a href="mailto:${escHtml(q.email)}">${escHtml(q.email)}</a></td>
      <td>${escHtml(q.productName)}</td>
      <td style="max-width:280px;white-space:pre-wrap;word-break:break-word;">${q.message ? escHtml(q.message) : '—'}</td>
      <td class="tbl-sub">${fmtDateTime(q.createdAt)}</td>
      <td class="tbl-sub">${fmtDateTime(q.seenAt)}</td>
    </tr>`).join('');
  return head + `
  ${NOTIF.error ? `<div class="panel panel-pad" style="color:var(--red);margin-bottom:12px;">${tr('Could not load notifications')}: ${escHtml(NOTIF.error)}</div>` : ''}
  <h2 class="section-title" style="margin-top:0;">${tr('New')} <span class="notif-count">${newOnes.length} ${tr('new request(s)')}</span></h2>
  ${newOnes.length ? `<p class="notif-note">${tr('These are now marked as seen and will move to “Earlier / Seen” next time.')}</p><div class="notif-list">${newOnes.map(notifCard).join('')}</div>`
    : `<div class="panel notif-empty">${NOTIF.total ? tr('No new requests') : tr('No quote requests yet. Requests from the public website will appear here.')}</div>`}
  <details class="notif-earlier" id="notifEarlier">
    <summary>${tr('Earlier / Seen')} <span class="badge badge-grey">${earlier.length}</span></summary>
    <div class="panel"><div class="table-scroll"><table>
      <tr><th>${tr('Name')}</th><th>${tr('Mobile')}</th><th>${tr('Email')}</th><th>${tr('Product')}</th><th>${tr('Message')}</th><th>${tr('Received at')}</th><th>${tr('Seen')}</th></tr>
      ${rows || `<tr><td colspan="7" class="empty">${tr('No earlier requests.')}</td></tr>`}
    </table></div></div>
  </details>`;
}
function signOut(){
  try{ sessionStorage.removeItem('threadline_token'); localStorage.removeItem('threadline_token'); }catch(e){}
  __authToken = null;
  try{ if(window.parent && window.parent!==window) window.parent.postMessage({type:'threadline-signout'}, '*'); else location.href='/admin'; }catch(e){}
}
window.addEventListener('message', (ev)=>{ if(ev && ev.data && ev.data.type==='threadline-auth') setTimeout(pollQuoteSummary, 50); });
window.addEventListener('message', (ev)=>{
  if(ev && ev.data && ev.data.type==='threadline-theme'){
    localStorage.setItem('threadline_dark', ev.data.dark?'1':'0');
    localStorage.setItem('threadline_erp_dark', ev.data.dark?'1':'0');
    document.documentElement.classList.toggle('dark-mode', !!ev.data.dark);
    const b=document.getElementById('darkToggle'); if(b) b.textContent=ev.data.dark?'☀ '+tr('Light'):'☾ '+tr('Dark');
  }
});
window.addEventListener('storage', (ev)=>{
  if(ev.key==='threadline_lang' && (ev.newValue==='en'||ev.newValue==='mr') && ev.newValue!==LANG){ LANG=ev.newValue; render(); }
  if(ev.key==='threadline_dark' || ev.key==='threadline_erp_dark') syncDarkFromStorage();
});


function toggleSidebar(){
  const sb=document.getElementById('sidebar');
  const bd=document.getElementById('sidebarBackdrop');
  if(!sb) return;
  const open = !sb.classList.contains('open');
  sb.classList.toggle('open', open);
  if(bd) bd.classList.toggle('show', open);
}
function closeSidebar(){
  const sb=document.getElementById('sidebar');
  const bd=document.getElementById('sidebarBackdrop');
  if(sb) sb.classList.remove('open');
  if(bd) bd.classList.remove('show');
}


/* ============================================================
   MEASUREMENT RULER — side tab on the owner dashboard.
   Uses CSS absolute units (1cm / 1in), so the physical size on
   screen is approximate and depends on the display's DPI.
   Auto-hides exactly 20s after being shown; clicking the tab
   again while visible restarts the 10s timer.
============================================================ */
let RULER_ON_DASHBOARD = false;
const RULER_MS = 10000;
let rulerHideTimer = null, rulerTickTimer = null, rulerDeadline = 0, rulerOrientation = 'h', rulerReturnFocus = null;

function rulerIsOpen(){ const p=document.getElementById('rulerPanel'); return !!p && !p.hidden; }
function syncRulerTab(){
  const tab = document.getElementById('rulerTab');
  if(!tab) return;
  const show = RULER_ON_DASHBOARD;
  tab.hidden = !show;
  tab.setAttribute('aria-label', tr('Measurement ruler'));
  tab.title = tr('Measurement ruler');
  if(!show && rulerIsOpen()) closeRuler(true);
  if(rulerIsOpen()) updateRulerLabels();
}
function cssUnitPx(unit){
  const probe = document.createElement('div');
  probe.style.cssText = 'position:absolute;visibility:hidden;width:10'+unit+';height:1px';
  document.body.appendChild(probe);
  const px = probe.getBoundingClientRect().width / 10;
  probe.remove();
  return px || (unit==='cm' ? 37.8 : 96);
}
function buildRuler(){
  const vertical = rulerOrientation === 'v';
  const pos = vertical ? 'top' : 'left';
  const pxCm = cssUnitPx('cm');
  // Size the strip to the free space of the content area (it never covers the sidebar).
  const mainRect = (document.getElementById('main')||document.body).getBoundingClientRect();
  const avail = vertical ? Math.max(160, window.innerHeight - 150 - 14 - 90) : Math.max(160, Math.min(mainRect.width - 150, 1500));
  const cms = Math.max(5, Math.floor(avail / pxCm));
  const inches = Math.floor((cms / 2.54) * 8) / 8;
  let cm = '', inch = '';
  for(let i=0;i<=cms*10;i++){
    const cls = i%10===0 ? 'l' : (i%5===0 ? 'm' : 's');
    cm += `<span class="t ${cls}" style="${pos}:${i}mm"></span>`;
    if(i%10===0) cm += `<span class="n" style="${pos}:${i}mm">${i/10}</span>`;
  }
  for(let j=0;j<=Math.floor(inches*8);j++){
    const cls = j%8===0 ? 'l' : (j%4===0 ? 'm' : (j%2===0 ? 'q' : 's'));
    inch += `<span class="t ${cls}" style="${pos}:${j/8}in"></span>`;
    if(j%8===0) inch += `<span class="n" style="${pos}:${j/8}in">${j/8}</span>`;
  }
  const len = `${cms}cm`;
  const size = vertical ? `height:${len}` : `width:${len}`;
  document.getElementById('rulerBody').innerHTML =
    `<div class="ruler ${vertical?'v':'h'}" style="${size}" role="img" aria-label="${tr('Centimetre and inch ruler')}: ${cms} cm / ${Math.floor(inches)} in">
       <div class="scale cm">${cm}</div><div class="mid"></div><div class="scale in">${inch}</div>
       <span class="unit cm-u">${LANG==='mr' ? tr('ruler-unit-cm') : 'cm'}</span><span class="unit in-u">${LANG==='mr' ? tr('ruler-unit-in') : 'in'}</span>
     </div>`;
  document.getElementById('rulerPanel').classList.toggle('is-vertical', vertical);
}
function updateRulerLabels(){
  document.getElementById('rulerTitle').textContent = tr('Measurement Ruler');
  const orient = document.getElementById('rulerOrient');
  orient.textContent = rulerOrientation==='h' ? '↕' : '↔';
  const olabel = rulerOrientation==='h' ? tr('Vertical') : tr('Horizontal');
  orient.setAttribute('aria-label', olabel); orient.title = olabel;
  const close = document.getElementById('rulerClose');
  close.setAttribute('aria-label', tr('Close ruler')); close.title = tr('Close ruler');
  document.getElementById('rulerNote').textContent = tr('Approximate — depends on screen');
  updateRulerCountdown();
}
function updateRulerCountdown(){
  const left = Math.max(0, rulerDeadline - Date.now());
  const secs = Math.ceil(left / 1000);
  const el = document.getElementById('rulerCount');
  if(el){ el.textContent = secs + (LANG==='mr' ? ' से.' : 's'); el.title = tr('Hides in {n}s').replace('{n}', secs); }
  const bar = document.getElementById('rulerBar');
  if(bar) bar.style.transform = `scaleX(${left / RULER_MS})`;
}
function clearRulerTimers(){
  if(rulerHideTimer){ clearTimeout(rulerHideTimer); rulerHideTimer = null; }
  if(rulerTickTimer){ clearInterval(rulerTickTimer); rulerTickTimer = null; }
}
function startRulerTimer(){
  clearRulerTimers();
  rulerDeadline = Date.now() + RULER_MS;
  rulerHideTimer = setTimeout(()=>closeRuler(), RULER_MS);
  rulerTickTimer = setInterval(updateRulerCountdown, 200);
  updateRulerCountdown();
}
function openRuler(){
  const panel = document.getElementById('rulerPanel');
  const wasOpen = rulerIsOpen();
  if(!wasOpen){
    rulerReturnFocus = document.activeElement;
    buildRuler();
    panel.hidden = false;
    document.getElementById('rulerTab').setAttribute('aria-expanded','true');
  }
  updateRulerLabels();
  startRulerTimer();            // (re)start the exact 10s window
  if(!wasOpen) setTimeout(()=>{ try{ document.getElementById('rulerClose').focus({preventScroll:true}); }catch(e){} }, 0);
}
function closeRuler(silent){
  clearRulerTimers();
  const panel = document.getElementById('rulerPanel');
  if(!panel || panel.hidden) return;
  const focusWasInside = panel.contains(document.activeElement);
  panel.hidden = true;
  const tab = document.getElementById('rulerTab');
  tab.setAttribute('aria-expanded','false');
  // Only move focus back if it was inside the ruler (don't steal focus on auto-hide).
  if(!silent && focusWasInside){
    const target = (rulerReturnFocus && document.contains(rulerReturnFocus) && rulerReturnFocus!==document.body) ? rulerReturnFocus : (!tab.hidden ? tab : null);
    try{ target && target.focus({preventScroll:true}); }catch(e){}
  }
  rulerReturnFocus = null;
}
function toggleRulerOrientation(){
  rulerOrientation = rulerOrientation==='h' ? 'v' : 'h';
  buildRuler();
  updateRulerLabels();          // timer keeps running — still hides 10s after it was shown
}
document.addEventListener('keydown', (e)=>{ if(e.key==='Escape' && rulerIsOpen()){ e.preventDefault(); closeRuler(); } });
window.addEventListener('resize', ()=>{ if(rulerIsOpen()) buildRuler(); });
window.addEventListener('pagehide', clearRulerTimers);

async function init(){
  document.title = 'CRB — Uniform Manufacturing ERP';
  const savedLang = localStorage.getItem('threadline_lang');
  if(savedLang==='en' || savedLang==='mr') LANG = savedLang;
  syncDarkFromStorage();
  currentWorkspace = 'internal';

  try{
    const data = await api('/api/erp/bootstrap');
    state.batches = [];
    state.assignments = [];
    state.payments = {};
    state.seq = {batch:0, assign:0};
    applyBootstrap(data);
  }catch(err){
    console.warn('Bootstrap API unavailable, keeping local demo seed:', err.message);
  }

  const startHash = (window.location.hash||'').slice(1);
  if(startHash) render(); else route('dashboard');
  syncDarkFromStorage();
  pollQuoteSummary();
}
init();
</script>
