<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRB — Uniforms &amp; Garments ERP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root{
  --sky:#0C8CE9;
  --sky-dark:#0A6FBD;
  --sky-tint:#EAF4FE;
  --navy:#12213B;
  --ink:#1C2B45;
  --slate:#5C6B84;
  --slate-soft:#8794A8;
  --paper:#FFFFFF;
  --canvas:#F5F7FA;
  --line:#E3E8EF;
  --green:#158A5E;
  --green-tint:#E7F5EF;
  --amber:#B4750B;
  --amber-tint:#FCF1DE;
  --red:#C23B3B;
  --red-tint:#FBEAEA;
  --radius:10px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:'Inter',sans-serif;
  background:var(--canvas);
  color:var(--ink);
  font-size:14px;
  line-height:1.5;
}
.mono{font-family:'IBM Plex Mono',monospace;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;border:none;background:none;font-size:14px;}
input,select{font-family:inherit;font-size:14px;}

/* ===== SHELL ===== */
#shell{display:flex;min-height:100vh;}
#sidebar{
  width:236px;flex-shrink:0;background:var(--navy);color:#CBD6EA;
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;
}
.brand{padding:22px 20px 18px;border-bottom:1px solid rgba(255,255,255,.08);}
.brand-mark{display:flex;align-items:center;gap:10px;}
.brand-swatch{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--sky),#1AA8FF);flex-shrink:0;position:relative;}
.brand-swatch::before,.brand-swatch::after{content:"";position:absolute;background:rgba(255,255,255,.85);border-radius:1px;}
.brand-swatch::before{width:14px;height:2.5px;top:9px;left:8px;}
.brand-swatch::after{width:14px;height:2.5px;bottom:9px;left:8px;}
.brand-name{font-weight:700;font-size:16.5px;color:#fff;letter-spacing:.2px;}
.brand-sub{font-size:11px;color:#8FA3C4;margin-top:1px;}
nav.navlinks{padding:14px 10px;flex:1;}
.nav-group-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:#5E729A;padding:14px 10px 6px;}
.nav-link{
  display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:7px;
  color:#B7C4DC;font-size:13.5px;font-weight:500;cursor:pointer;margin-bottom:1px;
}
.nav-link:hover{background:rgba(255,255,255,.06);color:#fff;}
.nav-link.active{background:var(--sky);color:#fff;}
.nav-ico{width:16px;text-align:center;font-size:14px;opacity:.9;}
.sidebar-foot{padding:14px 18px;border-top:1px solid rgba(255,255,255,.08);font-size:11px;color:#5E729A;}

#main{flex:1;min-width:0;}
#topbar{
  height:60px;background:var(--paper);border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;padding:0 26px;
  position:sticky;top:0;z-index:5;
}
.searchbox{
  display:flex;align-items:center;gap:8px;background:var(--canvas);border:1px solid var(--line);
  border-radius:8px;padding:7px 12px;width:300px;color:var(--slate-soft);font-size:13px;
}
.searchbox input{background:none;border:none;outline:none;flex:1;color:var(--ink);}
.topbar-right{display:flex;align-items:center;gap:18px;}
.role-pill{
  display:flex;align-items:center;gap:8px;background:var(--sky-tint);border:1px solid #CDE6FB;
  padding:6px 12px 6px 6px;border-radius:20px;
}
.role-avatar{width:26px;height:26px;border-radius:50%;background:var(--sky);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;}
.role-pill select{background:none;border:none;outline:none;font-weight:600;font-size:12.5px;color:var(--sky-dark);}
.bell{position:relative;font-size:16px;color:var(--slate);cursor:pointer;}
.bell .dot{position:absolute;top:-3px;right:-3px;width:7px;height:7px;border-radius:50%;background:var(--red);border:1.5px solid #fff;}

#content{padding:26px 30px 60px;max-width:1320px;}

/* ===== TYPE ===== */
h1.page-title{font-size:21px;font-weight:700;color:var(--navy);letter-spacing:-.2px;}
p.page-sub{color:var(--slate);font-size:13.5px;margin-top:3px;}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:12px;}
h2.section-title{font-size:14.5px;font-weight:700;color:var(--navy);margin:30px 0 12px;display:flex;align-items:center;gap:8px;}

/* ===== BUTTONS ===== */
.btn{padding:9px 16px;border-radius:8px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;}
.btn-primary{background:var(--sky);color:#fff;}
.btn-primary:hover{background:var(--sky-dark);}
.btn-ghost{background:var(--paper);color:var(--navy);border:1px solid var(--line);}
.btn-ghost:hover{border-color:var(--sky);color:var(--sky-dark);}
.btn-sm{padding:6px 11px;font-size:12px;border-radius:7px;}
.btn-danger-ghost{background:var(--paper);color:var(--red);border:1px solid #F1CFCF;}

/* ===== KPI CARDS ===== */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
.kpi-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;}
.kpi-label{font-size:12px;color:var(--slate);font-weight:500;}
.kpi-value{font-size:24px;font-weight:800;color:var(--navy);margin-top:6px;letter-spacing:-.4px;}
.kpi-value .unit{font-size:13px;font-weight:600;color:var(--slate-soft);margin-left:3px;}
.kpi-delta{font-size:11.5px;margin-top:6px;font-weight:600;}
.kpi-delta.up{color:var(--green);}
.kpi-delta.warn{color:var(--amber);}
.kpi-delta.flat{color:var(--slate-soft);}

/* ===== PANELS / CARDS ===== */
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);}
.panel-pad{padding:18px 20px;}
.two-col{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;align-items:start;}

/* attention list */
.alert-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);}
.alert-row:last-child{border-bottom:none;}
.alert-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.alert-dot.red{background:var(--red);}
.alert-dot.amber{background:var(--amber);}
.alert-text{flex:1;font-size:13px;color:var(--ink);}
.alert-text b{font-weight:700;}
.alert-tag{font-size:11px;color:var(--slate-soft);}

/* dept cards */
.dept-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;}
.dept-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:15px;cursor:pointer;transition:.15s;}
.dept-card:hover{border-color:var(--sky);box-shadow:0 2px 10px rgba(12,140,233,.08);}
.dept-card .ic{width:32px;height:32px;border-radius:8px;background:var(--sky-tint);display:flex;align-items:center;justify-content:center;font-size:15px;margin-bottom:10px;}
.dept-card h4{font-size:13.5px;font-weight:700;color:var(--navy);}
.dept-card .sub{font-size:11.5px;color:var(--slate);margin-top:2px;}
.dept-card .bar-wrap{height:5px;background:var(--line);border-radius:4px;margin-top:12px;overflow:hidden;}
.dept-card .bar{height:100%;background:var(--sky);}
.dept-card .stat{display:flex;justify-content:space-between;font-size:11px;color:var(--slate);margin-top:6px;}

/* pipeline */
.pipeline{display:flex;align-items:stretch;gap:0;overflow-x:auto;padding:4px 0 8px;}
.pipe-stage{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;min-width:150px;flex:1;position:relative;cursor:pointer;}
.pipe-stage:hover{border-color:var(--sky);}
.pipe-stage h5{font-size:12.5px;font-weight:700;color:var(--navy);}
.pipe-num{font-size:22px;font-weight:800;color:var(--sky-dark);margin-top:8px;}
.pipe-meta{font-size:11px;color:var(--slate);margin-top:6px;display:flex;flex-direction:column;gap:2px;}
.pipe-arrow{display:flex;align-items:center;justify-content:center;width:26px;color:var(--slate-soft);font-size:16px;flex-shrink:0;}

/* tables */
table{width:100%;border-collapse:collapse;}
th{
  text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--slate-soft);
  padding:9px 12px;border-bottom:1px solid var(--line);font-weight:600;background:var(--canvas);
}
td{padding:11px 12px;border-bottom:1px solid var(--line);font-size:13px;color:var(--ink);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr.row-click{cursor:pointer;}
tr.row-click:hover{background:var(--sky-tint);}
.tbl-name{font-weight:600;color:var(--navy);}
.tbl-sub{font-size:11.5px;color:var(--slate-soft);}

/* badges */
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;}
.badge-green{background:var(--green-tint);color:var(--green);}
.badge-amber{background:var(--amber-tint);color:var(--amber);}
.badge-red{background:var(--red-tint);color:var(--red);}
.badge-sky{background:var(--sky-tint);color:var(--sky-dark);}
.badge-grey{background:var(--canvas);color:var(--slate);border:1px solid var(--line);}

/* cards grid (employee/directory) */
.card-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.emp-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:16px;cursor:pointer;}
.emp-card:hover{border-color:var(--sky);}
.emp-top{display:flex;gap:11px;align-items:center;}
.emp-avatar{width:38px;height:38px;border-radius:50%;background:var(--navy);color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.emp-name{font-weight:700;font-size:14px;color:var(--navy);}
.emp-role{font-size:11.5px;color:var(--slate);}
.emp-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px;}
.emp-stat{background:var(--canvas);border-radius:7px;padding:8px 10px;}
.emp-stat .l{font-size:10.5px;color:var(--slate-soft);}
.emp-stat .v{font-size:14px;font-weight:700;color:var(--navy);margin-top:2px;}

/* passbook */
.passbook-head{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:16px;}
.passbook-id{background:var(--navy);color:#fff;border-radius:var(--radius);padding:20px 22px;flex:1;min-width:260px;position:relative;overflow:hidden;}
.passbook-id::after{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.05);}
.passbook-id .name{font-size:19px;font-weight:700;}
.passbook-id .code{font-size:12px;color:#93A8CB;margin-top:2px;}
.passbook-id .tags{display:flex;gap:7px;margin-top:12px;}
.summary-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px;}
.strip-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:13px 15px;}
.strip-card .l{font-size:11px;color:var(--slate);}
.strip-card .v{font-size:18px;font-weight:800;color:var(--navy);margin-top:4px;}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:22px 0 16px;}
.tab{padding:9px 14px;font-size:13px;font-weight:600;color:var(--slate);border-bottom:2px solid transparent;cursor:pointer;}
.tab.active{color:var(--sky-dark);border-color:var(--sky);}

/* forms / modal */
.overlay{position:fixed;inset:0;background:rgba(18,33,59,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;}
.modal{background:var(--paper);border-radius:12px;width:520px;max-width:100%;max-height:88vh;overflow-y:auto;}
.modal-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;}
.modal-head h3{font-size:15.5px;font-weight:700;color:var(--navy);}
.modal-close{font-size:18px;color:var(--slate-soft);cursor:pointer;}
.modal-body{padding:20px 22px;}
.modal-foot{padding:16px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;font-weight:600;color:var(--navy);margin-bottom:6px;}
.field input,.field select{
  width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:7px;outline:none;background:var(--canvas);
}
.field input:focus,.field select:focus{border-color:var(--sky);background:#fff;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.hint{font-size:11px;color:var(--slate-soft);margin-top:4px;}

.field textarea{
  width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:7px;outline:none;background:var(--canvas);
  font-family:inherit;font-size:13px;min-height:72px;resize:vertical;
}
.field textarea:focus{border-color:var(--sky);background:#fff;}
.dress-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;}
.dress-card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;}
.dress-card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
.dress-card-title{font-size:15px;font-weight:700;color:var(--navy);}
.dress-card-notes{font-size:12px;color:var(--slate);margin-top:2px;}
.dress-size-table{width:100%;border-collapse:collapse;font-size:12.5px;}
.dress-size-table th,.dress-size-table td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;}
.dress-size-table th{font-size:11px;color:var(--slate);font-weight:600;}
.meas-chip{display:inline-block;background:var(--canvas);border:1px solid var(--line);border-radius:6px;padding:2px 7px;margin:2px 3px 2px 0;font-size:11.5px;color:var(--ink);}
.meas-chip b{color:var(--navy);}
.dress-card-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px;}
.meas-edit-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
@media(max-width:600px){
  .dress-grid{grid-template-columns:1fr;}
  .meas-edit-grid{grid-template-columns:1fr;}
}


/* misc */
.empty{padding:40px 20px;text-align:center;color:var(--slate-soft);font-size:13px;}
.pill-nav{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;}
.pill{padding:6px 13px;border-radius:20px;font-size:12.5px;font-weight:600;border:1px solid var(--line);color:var(--slate);cursor:pointer;background:var(--paper);}
.pill.active{background:var(--navy);color:#fff;border-color:var(--navy);}
.toast{position:fixed;bottom:24px;right:24px;background:var(--navy);color:#fff;padding:12px 18px;border-radius:9px;font-size:13px;font-weight:500;z-index:80;box-shadow:0 8px 24px rgba(0,0,0,.2);opacity:0;transform:translateY(8px);transition:.2s;}
.toast.show{opacity:1;transform:translateY(0);}
.progress-mini{height:6px;background:var(--line);border-radius:4px;overflow:hidden;width:80px;display:inline-block;vertical-align:middle;margin-right:8px;}
.progress-mini > div{height:100%;background:var(--sky);}
.timeline{border-left:2px solid var(--line);margin-left:6px;}
.tl-item{position:relative;padding:0 0 18px 20px;}
.tl-item::before{content:"";position:absolute;left:-6.5px;top:2px;width:11px;height:11px;border-radius:50%;background:var(--sky);border:2px solid #fff;box-shadow:0 0 0 1px var(--sky);}
.tl-date{font-size:11px;color:var(--slate-soft);}
.tl-text{font-size:13px;color:var(--ink);margin-top:2px;}
::-webkit-scrollbar{height:8px;width:8px;}
::-webkit-scrollbar-thumb{background:#D3DCE8;border-radius:4px;}

@media(max-width:1000px){
  .kpi-grid,.dept-grid,.card-grid{grid-template-columns:repeat(2,1fr);}
  .two-col{grid-template-columns:1fr;}
  #sidebar{position:fixed;left:-236px;z-index:40;transition:.2s;}
  #sidebar.open{left:0;}
}

/* ===== ADDED: language toggle ===== */
.lang-toggle{display:flex;background:var(--canvas);border:1px solid var(--line);border-radius:20px;padding:3px;gap:2px;}
.lang-btn{border:none;background:transparent;padding:5px 11px;border-radius:16px;font-size:12px;font-weight:700;color:var(--slate);}
.lang-btn.active{background:var(--navy);color:#fff;}

/* ===== ADDED: image upload control ===== */
.upload-row{display:flex;align-items:center;gap:12px;}
.upload-btn{
  display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:8px;
  border:1px dashed #B9C6DC;background:var(--canvas);color:var(--sky-dark);font-weight:600;font-size:12.5px;cursor:pointer;
}
.upload-btn:hover{border-color:var(--sky);background:var(--sky-tint);}
.upload-preview{width:52px;height:52px;border-radius:8px;object-fit:cover;border:1px solid var(--line);}
.upload-preview-empty{width:52px;height:52px;border-radius:8px;border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;color:var(--slate-soft);font-size:18px;flex-shrink:0;}
.cloth-thumb{width:34px;height:34px;border-radius:6px;object-fit:cover;border:1px solid var(--line);vertical-align:middle;}
.cloth-thumb-empty{width:34px;height:34px;border-radius:6px;background:var(--canvas);border:1px dashed var(--line);display:inline-flex;align-items:center;justify-content:center;color:var(--slate-soft);font-size:13px;vertical-align:middle;}

/* ===== ADDED: rate card ===== */
.rate-table td, .rate-table th{text-align:center;}
.rate-table td:first-child, .rate-table th:first-child{text-align:left;}
.rate-input{width:64px;padding:6px 7px;border:1px solid var(--line);border-radius:6px;text-align:center;background:#fff;}
.rate-input:focus{border-color:var(--sky);outline:none;}
.rate-note{font-size:11.5px;color:var(--slate-soft);margin-top:10px;}

/* ===== ADDED: submit-cloth control ===== */
.btn-tiny{padding:5px 10px;font-size:11.5px;border-radius:6px;}

/* ===== ADDED: ERP dark mode ===== */
html.dark-mode{--paper:#111827;--canvas:#0B1220;--line:#29364A;--ink:#E7EEF8;--navy:#EAF2FF;--slate:#A8B6CC;--slate-soft:#8292AA;--sky-tint:#102B43;--green-tint:#123426;--amber-tint:#3A2B12;--red-tint:#3A1818;}
html.dark-mode body{background:var(--canvas);color:var(--ink);}
/* Keep the navigation rail dark. --navy becomes a light text colour in dark mode. */
html.dark-mode #sidebar{background:#111C2E;color:#CBD6EA;border-right:1px solid var(--line);}
html.dark-mode #topbar{background:#111827;border-color:var(--line);}
html.dark-mode .searchbox,.dark-mode .field input,.dark-mode .field select,.dark-mode .rate-input{background:#0B1220;color:var(--ink);border-color:var(--line);}
html.dark-mode th{background:#0E1728;color:var(--slate-soft);}
html.dark-mode .overlay{background:rgba(0,0,0,.62);}
.dark-toggle{background:var(--canvas);border:1px solid var(--line);border-radius:20px;padding:5px 10px;color:var(--ink);font-weight:700;font-size:12px;}
.search-results{display:grid;gap:10px;}
.search-result{width:100%;text-align:left;padding:14px 16px;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);color:var(--ink);}
.search-result:hover{border-color:var(--sky);box-shadow:0 4px 14px rgba(12,140,233,.12);}
.search-result-type{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--sky-dark);}
.search-result-title{font-weight:700;margin-top:3px;}.search-result-detail{font-size:12px;color:var(--slate);margin-top:2px;}

/* ===== CRB NEXT UI — modern workspace refresh ===== */
:root{--sky:#6B5CF6;--sky-dark:#5246D8;--sky-tint:#EEECFF;--navy:#18223A;--ink:#1D2942;--slate:#65708A;--slate-soft:#98A2B5;--paper:#FFFFFF;--canvas:#F5F7FC;--line:#E7EAF2;--green:#149B73;--green-tint:#E7F8F1;--amber:#B87513;--amber-tint:#FFF4DE;--red:#D55062;--red-tint:#FFF0F2;--radius:16px;}
body{background:var(--canvas);letter-spacing:-.01em;}
#shell{background:radial-gradient(circle at 88% 0%,#E9E7FF 0,transparent 25%),var(--canvas);}
#sidebar{width:252px;background:linear-gradient(180deg,#11182B 0%,#1A2440 100%);box-shadow:12px 0 36px rgba(23,32,58,.06);}
.brand{padding:26px 21px 20px;border-bottom-color:rgba(255,255,255,.07)}
.brand-swatch{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,#796AFF,#44D1DA);box-shadow:0 8px 18px rgba(92,78,239,.3)}

/* ===== Measurement ruler (side tab + auto-hiding overlay) ===== */
.ruler-tab{position:fixed;right:0;top:50%;transform:translateY(-50%);z-index:30;display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 8px;border:1px solid var(--line);border-right:0;border-radius:12px 0 0 12px;background:var(--paper);color:var(--navy);font:700 12.5px/1 Inter,system-ui,sans-serif;letter-spacing:.02em;cursor:pointer;box-shadow:-6px 8px 24px rgba(24,34,58,.14);transition:padding .15s,background .15s,color .15s}
.ruler-tab:hover{padding-right:12px;background:var(--sky);color:#fff;border-color:var(--sky)}
.ruler-tab:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.ruler-tab[aria-expanded="true"]{background:var(--sky);color:#fff;border-color:var(--sky)}
.ruler-tab-ico{font-size:17px;line-height:1}
.ruler-tab-label{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap}
.ruler-tab[hidden]{display:none}
.ruler-panel{position:fixed;z-index:45;left:50%;top:84px;transform:translateX(-50%);max-width:calc(100vw - 72px);background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:14px;box-shadow:0 24px 60px rgba(18,33,59,.28);padding:12px 14px 12px;font-family:Inter,system-ui,sans-serif;animation:rulerIn .18s ease}
.ruler-panel[hidden]{display:none}
.ruler-panel.is-vertical{top:50%;left:auto;right:60px;transform:translateY(-50%);max-height:calc(100vh - 24px)}
@keyframes rulerIn{from{opacity:0;margin-top:-6px}}
.ruler-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.ruler-title{font-weight:800;font-size:14px;color:var(--navy);margin-right:auto}
.ruler-count{font-size:12px;font-weight:700;color:var(--sky-dark,#5246D8);background:var(--sky-tint);padding:4px 9px;border-radius:999px;font-variant-numeric:tabular-nums}
.ruler-btn{border:1px solid var(--line);background:var(--canvas);color:var(--ink);border-radius:8px;padding:5px 10px;font:600 12px Inter,system-ui,sans-serif;cursor:pointer}
.ruler-btn:hover{border-color:var(--sky)}
.ruler-close{width:30px;height:30px;padding:0;font-size:18px;line-height:1}
.ruler-btn:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
.ruler-body{overflow:auto}
.ruler-note{margin-top:8px;font-size:11px;color:var(--slate-soft)}
.ruler-bar{position:absolute;inset:0 auto auto 0;height:3px;background:var(--sky);border-radius:2px;transform-origin:left;width:100%}
.ruler-progress{position:relative;height:3px;background:var(--line);border-radius:2px;margin-top:8px;overflow:hidden}
/* scales */
.ruler{position:relative;background:linear-gradient(180deg,#FFF9E8,#FDF1CF);border:1px solid #E5D3A0;border-radius:6px;color:#2A2416;box-sizing:content-box}
html.dark-mode .ruler{background:linear-gradient(180deg,#232B40,#1B2234);border-color:#3A4763;color:#E7EEF8}
.ruler.h{height:108px;padding:0 10px}
.ruler.v{width:118px;padding:10px 0}
.ruler .scale{position:absolute}
.ruler.h .scale{left:10px;right:10px;height:50%}
.ruler.h .scale.cm{top:0}.ruler.h .scale.in{bottom:0}
.ruler.v .scale{top:10px;bottom:10px;width:50%}
.ruler.v .scale.cm{left:0}.ruler.v .scale.in{right:0}
.ruler .t{position:absolute;background:currentColor}
.ruler.h .t{width:1px;transform:translateX(-.5px)}
.ruler.v .t{height:1px;transform:translateY(-.5px)}
.ruler.h .cm .t{top:0}.ruler.h .in .t{bottom:0}
.ruler.v .cm .t{left:0}.ruler.v .in .t{right:0}
.ruler.h .t.s{height:9px}.ruler.h .t.m{height:15px}.ruler.h .t.l{height:24px}.ruler.h .t.q{height:12px}
.ruler.v .t.s{width:9px}.ruler.v .t.m{width:15px}.ruler.v .t.l{width:24px}.ruler.v .t.q{width:12px}
.ruler .n{position:absolute;font-size:10.5px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.ruler.h .cm .n{top:27px;transform:translateX(-50%)}
.ruler.h .in .n{bottom:27px;transform:translateX(-50%)}
.ruler.v .cm .n{left:27px;transform:translateY(-50%)}
.ruler.v .in .n{right:27px;transform:translateY(-50%)}
.ruler .unit{position:absolute;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.55}
.ruler.h .unit.cm-u{right:14px;top:40px}.ruler.h .unit.in-u{right:14px;bottom:40px}
.ruler.v .unit{writing-mode:vertical-rl}
.ruler.v .unit.cm-u{left:40px;bottom:14px}.ruler.v .unit.in-u{right:40px;bottom:14px}
.ruler .mid{position:absolute;background:currentColor;opacity:.18}
.ruler.h .mid{left:10px;right:10px;top:50%;height:1px}
.ruler.v .mid{top:10px;bottom:10px;left:50%;width:1px}
@media(max-width:640px){
  .ruler-tab{padding:10px 6px;gap:0;border-radius:10px 0 0 10px}
  .ruler-tab-label{display:none}
  .ruler-tab-ico{font-size:16px}
  .ruler-panel{top:70px;max-width:calc(100vw - 52px);left:8px;transform:none;padding:10px}
  .ruler-panel.is-vertical{right:46px;left:auto}
}
@media(prefers-reduced-motion:reduce){.ruler-panel{animation:none}.ruler-tab{transition:none}}

/* ===== CRB ATELIER THEME (matches the public website) ===== */
:root{--sky:#26345f;--sky-dark:#1b264a;--sky-tint:#eceef5;--navy:#1f1d1a;--ink:#2a2723;--slate:#6b645a;--slate-soft:#978e81;--paper:#fffdf9;--canvas:#f6f1e8;--line:#e7dfd1;--brass:#a07a34;--brass-soft:#c9a35c;--green:#2f7a55;--green-tint:#e6f1ea;--amber:#9a6a14;--amber-tint:#f8eedb;--red:#b4443b;--red-tint:#f8e7e4;--radius:14px;--serif:'Cormorant Garamond',Georgia,serif}

.btn-ghost{background:var(--paper);border:1px solid var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--sky);color:var(--sky)}
.kpi-card,.panel,.dept-card,.emp-card,.strip-card,.pipe-stage,.dress-card{background:var(--paper);border:1px solid var(--line);box-shadow:0 1px 0 rgba(31,29,26,.03);border-radius:var(--radius)}
.kpi-card{position:relative;overflow:hidden}
.kpi-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--brass-soft);opacity:.7}
.kpi-label{color:var(--slate);letter-spacing:.1em;font-size:10.5px}
.kpi-value{font-weight:700;color:var(--navy);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.dept-card:hover,.emp-card:hover{border-color:var(--brass-soft);box-shadow:0 10px 24px rgba(31,29,26,.08)}
.dept-card .ic{background:var(--sky-tint)}
.dept-card .bar{background:linear-gradient(90deg,var(--sky),var(--brass-soft))}
.dept-card .bar-wrap{background:var(--line)}
th{background:#f3ece0;color:var(--slate);font-size:10.5px;letter-spacing:.08em}
td{font-variant-numeric:tabular-nums}
tr.row-click:hover{background:var(--sky-tint)}
.emp-avatar{background:var(--sky)}
.emp-stat{background:var(--canvas)}
.passbook-id{background:linear-gradient(135deg,#26345f,#1b264a)}
.pill.active{background:var(--sky);border-color:var(--sky);color:#faf6ef}
.tab.active{color:var(--sky);border-color:var(--sky)}
.field input,.field select,.field textarea{background:var(--paper);border-color:var(--line);color:var(--ink)}
.field input:focus,.field select:focus,.field textarea:focus{background:var(--paper);border-color:var(--sky);box-shadow:0 0 0 3px rgba(38,52,95,.12)}
.modal{background:var(--paper);border-radius:18px}
.modal-head h3{font-family:var(--serif);font-size:22px}
.overlay{background:rgba(31,29,26,.45)}
.toast{background:#1d2645;color:#faf6ef}
.badge-sky{background:var(--sky-tint);color:var(--sky)}
.upload-btn{background:var(--canvas);border-color:var(--line);color:var(--sky)}
.combo-menu{background:var(--paper)}
.rate-input{background:var(--paper);color:var(--ink)}
.search-result-type{color:var(--brass)}
.client-empty-icon{background:var(--sky-tint);color:var(--sky)}
.role-avatar{background:var(--sky)}
/* ruler: small arrow tab */
.ruler-tab{width:26px;height:44px;padding:0;gap:0;justify-content:center;border-radius:10px 0 0 10px;background:var(--sky);color:#faf6ef;border:1px solid var(--sky);border-right:0;box-shadow:-4px 6px 16px rgba(31,29,26,.18)}
.ruler-tab:hover,.ruler-tab[aria-expanded="true"]{padding:0;width:30px;background:var(--sky-dark);color:#fff}
.ruler-title{font-family:var(--serif);font-size:18px}
.ruler-panel{font-family:'DM Sans',system-ui,sans-serif}
@media(max-width:640px){.ruler-tab{width:24px;height:40px;padding:0}}
/* notifications page */
.notif-head-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.notif-count{font-size:12px;font-weight:700;color:var(--brass);background:var(--amber-tint);padding:4px 10px;border-radius:999px}
.notif-list{display:grid;gap:12px}
.notif-card{background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--brass-soft);border-radius:var(--radius);padding:16px 18px;display:grid;grid-template-columns:1fr auto;gap:6px 16px}
.notif-card .who{font-weight:700;font-size:16px;color:var(--navy)}
.notif-card .new-pill{display:inline-block;margin-left:8px;background:#b4443b;color:#fff;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border-radius:999px;padding:2px 8px;vertical-align:middle}
.notif-card time{font-size:12px;color:var(--slate);text-align:right}
.notif-meta{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13px;color:var(--ink)}
.notif-meta a{color:var(--sky);font-weight:600}
.notif-meta a:hover{text-decoration:underline}
.notif-msg{grid-column:1/-1;background:var(--canvas);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:13px;color:var(--ink);white-space:pre-wrap;word-break:break-word}
.notif-note{font-size:12px;color:var(--slate);margin:4px 0 14px}
.notif-earlier{margin-top:26px}
.notif-earlier summary{cursor:pointer;font-family:var(--serif);font-size:22px;font-weight:700;color:var(--navy);list-style:none;display:flex;align-items:center;gap:8px}
.notif-earlier summary::-webkit-details-marker{display:none}
.notif-earlier summary::before{content:"▸";font-size:14px;color:var(--brass);transition:transform .15s}
.notif-earlier[open] summary::before{transform:rotate(90deg)}
.notif-earlier .panel{margin-top:12px}
.notif-empty{padding:34px 20px;text-align:center;color:var(--slate)}
@media(max-width:640px){.notif-card{grid-template-columns:1fr}.notif-card time{text-align:left}.signout-btn #signOutLabel{display:none}}
/* ===== Dark mode (atelier) — every surface uses variables ===== */
html.dark-mode{--sky:#8ea0d8;--sky-dark:#a9b8e6;--sky-tint:#232a42;--navy:#f3ede3;--ink:#e9e3d8;--slate:#b3aa9c;--slate-soft:#8f877b;--paper:#1c1b21;--canvas:#131217;--line:#312e37;--brass:#d9b56b;--brass-soft:#c9a35c;--green:#6cc497;--green-tint:#16302a;--amber:#e0b35a;--amber-tint:#352a15;--red:#ec8a80;--red-tint:#3a1d1c}
html.dark-mode body{background:var(--canvas);color:var(--ink)}
html.dark-mode #shell{background:var(--canvas)!important}
html.dark-mode #sidebar{background:linear-gradient(180deg,#191a26,#121219)!important;border-right-color:var(--line)}
html.dark-mode #topbar{background:rgba(28,27,33,.9)!important;border-color:var(--line)}
html.dark-mode .searchbox,html.dark-mode .lang-toggle,html.dark-mode .dark-toggle,html.dark-mode .workspace-tabs,html.dark-mode .bell,html.dark-mode .signout-btn,html.dark-mode .menu-btn{background:var(--paper)!important;border-color:var(--line)!important;color:var(--ink)}
html.dark-mode .lang-btn.active,html.dark-mode .workspace-tab.active,html.dark-mode .pill.active{background:#3a4a80!important;color:#fff!important;border-color:#3a4a80!important}
html.dark-mode .nav-link.active{background:#f3ede3;color:#191a26}
html.dark-mode .btn-primary{background:#3a4a80;color:#fff;box-shadow:none}
html.dark-mode .btn-primary:hover{background:#4a5c99}
html.dark-mode .btn-ghost,html.dark-mode .btn-danger-ghost,html.dark-mode .kpi-card,html.dark-mode .panel,html.dark-mode .dept-card,html.dark-mode .emp-card,html.dark-mode .strip-card,html.dark-mode .pipe-stage,html.dark-mode .modal,html.dark-mode .search-result,html.dark-mode .client-empty-state,html.dark-mode .dress-card,html.dark-mode .notif-card,html.dark-mode .combo-menu,html.dark-mode .ruler-panel,html.dark-mode .pill{background:var(--paper)!important;border-color:var(--line)!important;color:var(--ink)}
html.dark-mode th,html.dark-mode .emp-stat,html.dark-mode .field input,html.dark-mode .field select,html.dark-mode .field textarea,html.dark-mode .rate-input,html.dark-mode .notif-msg,html.dark-mode .meas-chip,html.dark-mode .upload-preview-empty,html.dark-mode .cloth-thumb-empty,html.dark-mode .badge-grey,html.dark-mode .ruler-btn{background:#16151b!important;color:var(--ink)!important;border-color:var(--line)!important}
html.dark-mode .field input::placeholder,html.dark-mode .field textarea::placeholder,html.dark-mode .searchbox input::placeholder{color:var(--slate-soft)}
html.dark-mode .searchbox input{color:var(--ink)}
html.dark-mode input[type=date]{color-scheme:dark}
html.dark-mode select option{background:#1c1b21;color:var(--ink)}
html.dark-mode .upload-btn{background:#16151b!important;border-color:var(--line)!important;color:var(--sky)}
html.dark-mode .toast{background:#f3ede3;color:#191a26}
html.dark-mode .overlay{background:rgba(0,0,0,.6)}
html.dark-mode .passbook-id{background:linear-gradient(135deg,#2c3760,#1d2645)}
html.dark-mode .tl-item::before{border-color:var(--paper)}
html.dark-mode .bell-count{border-color:var(--paper)}
html.dark-mode ::-webkit-scrollbar-thumb{background:#3a3742}
html.dark-mode .ruler-tab{background:#3a4a80;border-color:#3a4a80;color:#fff}
html[lang="mr"] body :not(.brand-name):not(.mono){letter-spacing:normal!important}

/* ===== Round 4: slim, non-intrusive ruler strip (10 s auto-hide) ===== */
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.ruler-panel.ruler-strip{position:fixed;z-index:44;top:auto;bottom:12px;left:264px;right:40px;transform:none;max-width:none;max-height:none;
  display:flex;align-items:center;gap:8px;padding:0 6px 0 0;background:transparent;border:0;box-shadow:none;border-radius:10px;pointer-events:none;animation:rulerStripIn .18s ease}
.ruler-panel.ruler-strip[hidden]{display:none}
.ruler-strip > *{pointer-events:auto}
.ruler-strip .ruler-body{overflow:hidden;flex:0 1 auto;min-width:0;border-radius:8px;box-shadow:0 8px 22px -12px rgba(18,24,40,.45)}
.ruler-strip .ruler-progress{position:absolute;left:0;right:0;top:-5px;height:2px;margin:0;background:transparent;pointer-events:none}
.ruler-strip .ruler-bar{height:2px;background:var(--brass,#a07a34)}
.ruler-ctl{display:flex;align-items:center;gap:4px;padding:4px;border-radius:999px;background:rgba(250,246,239,.92);border:1px solid rgba(160,122,52,.35);box-shadow:0 6px 16px -10px rgba(18,24,40,.5);backdrop-filter:blur(6px)}
.ruler-strip .ruler-count{font:700 11px/1 "DM Sans",system-ui,sans-serif;padding:5px 7px;border-radius:999px;background:transparent;color:#5b4a2a;min-width:30px;text-align:center}
.ruler-mini{width:26px;height:26px;border-radius:50%;border:1px solid rgba(160,122,52,.35);background:#fffdf8;color:#26345f;font:700 14px/1 system-ui,sans-serif;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.ruler-mini:hover{background:#26345f;color:#fff;border-color:#26345f}
.ruler-mini:focus-visible{outline:2px solid #a07a34;outline-offset:2px}
.ruler-strip .ruler-close{font-size:17px;width:26px;height:26px}
.ruler-strip .ruler.h{height:58px;padding:0 30px 0 10px;background:rgba(255,249,232,.9);backdrop-filter:blur(4px)}
.ruler-strip .ruler.h .t.s{height:6px}.ruler-strip .ruler.h .t.q{height:8px}.ruler-strip .ruler.h .t.m{height:10px}.ruler-strip .ruler.h .t.l{height:15px}
.ruler-strip .ruler.h .cm .n{top:16px}.ruler-strip .ruler.h .in .n{bottom:16px}
.ruler-strip .ruler .n{font-size:9.5px}
.ruler-strip .ruler.h .unit.cm-u{right:5px;top:6px}.ruler-strip .ruler.h .unit.in-u{right:5px;bottom:6px}
.ruler-strip.is-vertical{left:auto;right:36px;top:150px;bottom:14px;flex-direction:column;align-items:center;padding:0}
.ruler-strip.is-vertical .ruler-body{max-height:calc(100% - 44px)}
.ruler-strip.is-vertical .ruler-ctl{order:1;flex-direction:row}
.ruler-strip.is-vertical .ruler-progress{top:-6px}
.ruler-strip .ruler.v{width:58px;padding:10px 0 30px;background:rgba(255,249,232,.9);backdrop-filter:blur(4px)}
.ruler-strip .ruler.v .t.s{width:6px}.ruler-strip .ruler.v .t.q{width:8px}.ruler-strip .ruler.v .t.m{width:10px}.ruler-strip .ruler.v .t.l{width:15px}
.ruler-strip .ruler.v .cm .n{left:16px}.ruler-strip .ruler.v .in .n{right:16px}
.ruler-strip .ruler.v .unit.cm-u{left:4px;bottom:4px;writing-mode:horizontal-tb}.ruler-strip .ruler.v .unit.in-u{right:4px;bottom:4px;writing-mode:horizontal-tb}
html.dark-mode .ruler-strip .ruler{background:rgba(27,30,40,.9)!important;border-color:#3a3f52;color:#ece6da}
html.dark-mode .ruler-ctl{background:rgba(25,26,38,.92);border-color:#3a3f52}
html.dark-mode .ruler-strip .ruler-count{color:#d9c49a}
html.dark-mode .ruler-mini{background:#232536;color:#ece6da;border-color:#3a3f52}
html.dark-mode .ruler-mini:hover{background:#d6ab6b;color:#191a26}
@keyframes rulerStripIn{from{opacity:0;transform:translateY(6px)}}
@media(max-width:1000px){.ruler-panel.ruler-strip{left:8px;right:34px;bottom:8px}.ruler-strip.is-vertical{left:auto;right:32px;top:84px}}
@media(prefers-reduced-motion:reduce){.ruler-panel.ruler-strip{animation:none}}

/* ===== Round 4: sidebar brand never scrolls away ===== */
#sidebar{overflow:hidden!important;display:flex;flex-direction:column}
#sidebar .brand{flex:0 0 auto;position:relative;z-index:1}
#sidebar nav.navlinks{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:rgba(201,163,92,.35) transparent}
#sidebar .sidebar-foot{flex:0 0 auto}
@media(min-width:1001px){
  #sidebar{position:fixed!important;top:0;left:0;bottom:0;height:100vh;width:252px;z-index:30}
  #main{margin-left:252px}
}
@media(max-width:1000px){#sidebar{height:100vh;height:100dvh}}

/* ===== Round 4: employee department chips ===== */
.dept-chips{flex-wrap:wrap;gap:8px}
.dept-chip{display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:12.5px;font-weight:600;padding:7px 13px}
.dept-chip .chip-count{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:rgba(38,52,95,.08);font-size:11px;font-weight:700}
.dept-chip.active .chip-count{background:rgba(255,255,255,.22)}
.dept-chip:focus-visible{outline:2px solid var(--brass,#a07a34);outline-offset:2px}
html.dark-mode .dept-chip .chip-count{background:rgba(255,255,255,.1)}

/* ===== Round 4: Dress Sizes ===== */
.sz-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 16px}
.sz-tab{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font:600 13.5px/1 "DM Sans",system-ui,sans-serif;cursor:pointer;transition:background .15s,border-color .15s,color .15s}
.sz-tab:hover{border-color:#a07a34}
.sz-tab.active{background:#26345f;border-color:#26345f;color:#faf6ef}
.sz-tab-count{font-size:11px;font-weight:700;padding:3px 7px;border-radius:999px;background:rgba(38,52,95,.08)}
.sz-tab.active .sz-tab-count{background:rgba(255,255,255,.2)}
.sz-tab:focus-visible{outline:2px solid #a07a34;outline-offset:2px}
.sz-kpis{grid-template-columns:repeat(3,1fr);margin-bottom:16px}
.sz-panel{padding:0;overflow:hidden}
.sz-panel-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;padding:20px 22px 14px;border-bottom:1px solid var(--line)}
.sz-title{font-family:"Cormorant Garamond",Georgia,serif;font-size:28px;font-weight:700;margin:0;color:var(--navy)}
.sz-sub{margin:4px 0 0;color:var(--slate);font-size:13px}
.sz-panel-actions{display:flex;gap:8px;flex-wrap:wrap}
.sz-del-btn{color:var(--red)!important}
.sz-table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.sz-table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums;min-width:520px}
.sz-table th,.sz-table td{padding:11px 14px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
.sz-table thead th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--slate);font-weight:700;background:rgba(160,122,52,.06);position:sticky;top:0}
.sz-table th.sz-size,.sz-table thead th:first-child{text-align:left;font-weight:700;color:var(--navy)}
.sz-table tbody tr:hover{background:rgba(160,122,52,.06)}
.sz-table tbody tr:last-child th,.sz-table tbody tr:last-child td{border-bottom:0}
.sz-empty{color:var(--slate-soft)}
.sz-actions{text-align:right!important;width:1%}
.sz-icon{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;font-size:14px;margin-left:4px}
.sz-icon:hover{border-color:#26345f;color:#26345f}
.sz-icon.sz-del:hover{border-color:var(--red);color:var(--red)}
.sz-unit{font-weight:400;color:var(--slate-soft);font-size:11px}
.sz-err{color:var(--red);font-size:13px;margin:8px 0 0;min-height:1em}
.sz-checks{display:flex;flex-wrap:wrap;gap:6px 14px}
.sz-check{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--ink);cursor:pointer}
html.dark-mode .sz-tab{background:var(--paper);border-color:var(--line);color:var(--ink)}
html.dark-mode .sz-tab.active{background:#3a4a80;border-color:#3a4a80;color:#fff}
html.dark-mode .sz-table thead th{background:rgba(255,255,255,.04)}
html.dark-mode .sz-icon{background:transparent;border-color:var(--line);color:var(--ink)}
html.dark-mode .sz-title{color:var(--ink)}
@media(max-width:640px){.sz-kpis{grid-template-columns:repeat(3,1fr);gap:8px}.sz-panel-head{padding:16px}.sz-title{font-size:24px}}
html.dark-mode .ruler-panel.ruler-strip,.ruler-panel.ruler-strip{background:transparent!important;border:0!important;box-shadow:none!important}
html.dark-mode .sz-table th,html.dark-mode .sz-table td{background:transparent!important;border-color:var(--line)!important;color:var(--ink)}
html.dark-mode .sz-table thead th{background:rgba(255,255,255,.04)!important;color:var(--slate)!important}
.sz-table th,.sz-table td{border-left:0!important;border-right:0!important}
</style>
</head>
<body>
<div id="shell">
  <aside id="sidebar">
    <div class="brand">
      <div class="brand-mark">
        <img class="brand-logo" src="/brand/logo-mark.svg" alt="" width="40" height="40">
        <div>
          <div class="brand-name">CRB</div>
          <div class="brand-sub">Uniforms &amp; Garments</div>
        </div>
      </div>
    </div>
    <nav class="navlinks" id="navlinks"></nav>
    <div class="sidebar-foot" id="sidebarFoot">Owner workspace</div>
  </aside>

  <div class="sidebar-backdrop" id="sidebarBackdrop" onclick="closeSidebar()"></div>
  <div id="main">
    <div id="topbar">
      <button type="button" class="menu-btn" id="menuBtn" onclick="toggleSidebar()" aria-label="Open menu">☰</button>
      <div class="searchbox">
        <span>⌕</span>
        <input id="globalSearch" placeholder="Search employee, batch, order…" oninput="onGlobalSearch(this.value)">
      </div>
      <div class="topbar-right">
        <div class="lang-toggle" title="Change language / भाषा बदला">
          <button class="lang-btn" id="langBtnEn" onclick="setLang('en')">EN</button>
          <button class="lang-btn" id="langBtnMr" onclick="setLang('mr')">मराठी</button>
        </div>
        <button class="dark-toggle" id="darkToggle" onclick="toggleDarkMode()">☾ Dark</button>
        <button type="button" class="bell" id="quoteBell" title="Notifications" aria-label="Notifications" onclick="route('notifications')"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 22a2.5 2.5 0 0 0 2.45-2h-4.9A2.5 2.5 0 0 0 12 22Zm7-6V11a7 7 0 0 0-5.5-6.84V3.5a1.5 1.5 0 0 0-3 0v.66A7 7 0 0 0 5 11v5l-2 2v1h18v-1l-2-2Z"/></svg><span class="bell-count" id="quoteBellCount" hidden>0</span></button>
        <div class="workspace-tabs" aria-label="Dashboard workspace">
          <button class="workspace-tab active" data-workspace="internal" onclick="switchWorkspace('internal')">Internal</button>
          <button class="workspace-tab" data-workspace="external" onclick="switchWorkspace('external')">External</button>
          <button class="workspace-tab" data-workspace="client" onclick="switchWorkspace('client')">Client</button>
        </div>
        <button type="button" class="signout-btn" id="signOutBtn" onclick="signOut()" title="Sign out"><span aria-hidden="true">⎋</span> <span id="signOutLabel">Sign out</span></button>
      </div>
    </div>
    <div id="content"></div>
  </div>
</div>
<div id="toast" class="toast"></div>
<div id="modalRoot"></div>
<button type="button" id="rulerTab" class="ruler-tab" hidden aria-expanded="false" aria-controls="rulerPanel" aria-label="Measurement ruler" title="Measurement ruler" onclick="openRuler()">
  <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
</button>
<div id="rulerPanel" class="ruler-panel ruler-strip" role="region" aria-labelledby="rulerTitle" hidden tabindex="-1">
  <span class="sr-only" id="rulerTitle">Measurement Ruler</span>
  <div class="ruler-progress" aria-hidden="true"><span class="ruler-bar" id="rulerBar"></span></div>
  <div class="ruler-body" id="rulerBody"></div>
  <div class="ruler-ctl">
    <span class="ruler-count" id="rulerCount" aria-live="off" title="Hides in 10s">10s</span>
    <button type="button" class="ruler-mini" id="rulerOrient" onclick="toggleRulerOrientation()" aria-label="Vertical" title="Vertical">↕</button>
    <button type="button" class="ruler-mini ruler-close" id="rulerClose" onclick="closeRuler()" aria-label="Close ruler" title="Close ruler">×</button>
  </div>
  <span class="sr-only" id="rulerNote">Approximate — depends on screen</span>
</div>

<script>
/* ============================================================
   DATA MODEL
============================================================ */

function tr(s){ return LANG==='mr' ? (T[s] || s) : s; }
function L(en, mr){ return LANG==='mr' ? mr : en; }
// Generic Marathi pass: translates any remaining literal UI text (text nodes + placeholder/title/aria-label)
// that exactly matches a dictionary key, plus a few unit patterns. User data (names, IDs) is left as-is.
const TR_PATTERNS = [
  [/\b(\d+(?:\.\d+)?) pcs\b/g, '$1 नग'],
  [/₹ ?\/ ?pc\b/g, '₹ / नग'],
  [/\/pc\b/g, '/नग'],
  [/ M avail\./g, ' M उपलब्ध'],
  [/^pcs$/g, 'नग'],
  [/^(₹[\d,]+) due$/g, '$1 बाकी'],
  [/(^| · )Vendor( ·|$)/g, '$1व्हेंडर$2'],
  [/ · Bill /g, ' · बिल '],
  [/^Close ruler$/g, 'पट्टी बंद करा'],
];
function trText(s){
  if(LANG!=='mr' || !s) return s;
  const m = /^(\s*)([\s\S]*?)(\s*)$/.exec(s);
  const core = m[2];
  if(!core) return s;
  if(Object.prototype.hasOwnProperty.call(T, core)) return m[1] + T[core] + m[3];
  let out = core;
  TR_PATTERNS.forEach(([re, rep])=>{ out = out.replace(re, rep); });
  return m[1] + out + m[3];
}
function translateDom(root){
  if(LANG!=='mr' || !root) return;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {acceptNode:n=> (n.parentNode && /^(SCRIPT|STYLE|TEXTAREA)$/.test(n.parentNode.nodeName)) ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT});
  const nodes=[]; while(w.nextNode()) nodes.push(w.currentNode);
  nodes.forEach(n=>{ const t=trText(n.nodeValue); if(t!==n.nodeValue) n.nodeValue=t; });
  root.querySelectorAll('[placeholder],[title],[aria-label]').forEach(el=>['placeholder','title','aria-label'].forEach(a=>{
    const v=el.getAttribute(a); if(v){ const t=trText(v); if(t!==v) el.setAttribute(a,t); }
  }));
}


/* ===== API persistence helpers ===== */
let __authToken = null;
function readAuthToken(){
  if(__authToken) return __authToken;
  try{
    const t = sessionStorage.getItem('threadline_token') || localStorage.getItem('threadline_token');
    if(t){ __authToken = t; return t; }
  }catch(e){}
  return null;
}
function authHeaders(){
  const h={'Content-Type':'application/json'};
  const t = readAuthToken();
  if(t) h.Authorization = 'Bearer '+t;
  return h;
}
async function api(url, opts={}){
  const res=await fetch(url,{...opts, headers:{...authHeaders(), ...(opts.headers||{})}});
  let data={}; try{ data=await res.json(); }catch(e){}
  if(!res.ok) throw new Error(data.message||('HTTP '+res.status));
  return data;
}
window.addEventListener('message', (ev)=>{
  if(!ev || !ev.data) return;
  if(ev.data.type==='threadline-auth' && ev.data.token){
    __authToken = ev.data.token;
    try{
      sessionStorage.setItem('threadline_token', ev.data.token);
      localStorage.setItem('threadline_token', ev.data.token);
    }catch(e){}
  }
  if(ev.data.type==='threadline-auth-clear'){
    __authToken = null;
    try{
      sessionStorage.removeItem('threadline_token');
      localStorage.removeItem('threadline_token');
    }catch(e){}
  }
});
// Ask parent for token (iframe may not share sessionStorage reliably)
try{ if(window.parent && window.parent!==window) window.parent.postMessage({type:'threadline-auth-request'}, '*'); }catch(e){}

    }))

function applyBootstrap(data){
  if(!data) return;
  if(Array.isArray(data.suppliers)&&data.suppliers.length){
    SUPPLIERS=data.suppliers.slice().sort((a,b)=>a.localeCompare(b));
  }
  if(Array.isArray(data.employees)&&data.employees.length){
    state.employees=data.employees.map(e=>({id:e.id,name:e.name,dept:e.dept,type:e.type||'internal',active:e.active!==false}));
  }
  if(Array.isArray(data.batches)){
    state.batches=data.batches.map(b=>({
      id:b.id, clothName:b.clothName, supplier:b.supplier, purchaseDate:b.purchaseDate,
      billNo:b.billNo, pcs:b.pcs, meters:b.meters, ratePerMeter:b.ratePerMeter,
      amount:b.amount, paidAmount:b.paidAmount,
      pendingAmount:b.pendingAmount!=null?b.pendingAmount:(b.amount-(b.paidAmount||0)),
      distributedM:b.distributedM||0, imageUrl:b.imageUrl||null
    }));
  }
  if(Array.isArray(data.assignments)){
    state.assignments=data.assignments.map(a=>({
      id:a.id, batchId:a.batchId, item:a.item, dept:a.dept, employeeId:a.employeeId,
      qtyIn:a.qtyIn, unitIn:a.unitIn, dateAssigned:a.dateAssigned, status:a.status,
      materialUsed:a.materialUsed, piecesProduced:a.piecesProduced, dateCompleted:a.dateCompleted,
      sourceAssignmentId:a.sourceAssignmentId, earnings:a.earnings||0,
      materialReturned:!!a.materialReturned, materialReturnDate:a.materialReturnDate||null
    }));
  }
  if(data.payments) state.payments=data.payments;
  if(Array.isArray(data.dressTypes)){
    state.dressTypes=data.dressTypes.map(mapDressTypeFromApi);
  }
  if(data.seq){
    state.seq.batch=data.seq.batch||state.batches.length;
    state.seq.assign=data.seq.assign||state.assignments.length;
  }
}
async function persistAssignment(a){
  try{ await api('/api/assignments/'+encodeURIComponent(a.id),{method:'PUT', body:JSON.stringify(a)}); }
  catch(err){ console.warn('persistAssignment', err.message); }
}
async function persistBatchDistributed(b){
  try{ await api('/api/batches/'+encodeURIComponent(b.id),{method:'PATCH', body:JSON.stringify({distributedM:b.distributedM})}); }
  catch(err){ console.warn('persistBatchDistributed', err.message); }
}

function addBatch(o){
  const b = {
    id: nextBatchId(), clothName:o.clothName, supplier:o.supplier, purchaseDate:o.purchaseDate,
    billNo:o.billNo, pcs:o.pcs, meters:o.meters, ratePerMeter:o.ratePerMeter,
    amount: Math.round(o.meters*o.ratePerMeter), paidAmount:o.paidAmount||0,
    distributedM:0, imageUrl:o.imageUrl||null,
  };
  b.pendingAmount = b.amount - b.paidAmount;
  state.batches.push(b);
  return b;
}
function batchRemaining(b){ return +(b.meters - b.distributedM).toFixed(1); }

/* ---- assignment lifecycle ----
  status: 'in-progress' | 'completed' | 'ready'
  dept 'vendor' bypasses chain
*/
function createAssignment(o){
  const a = {
    id: nextAssignId(), batchId:o.batchId, item:o.item, dept:o.dept, employeeId:o.employeeId,
    qtyIn: o.qtyIn, unitIn: o.unitIn, // meters for cutting/vendor, pieces otherwise
    dateAssigned: o.dateAssigned || todayStr(),
    status:'in-progress',
    materialUsed:null, piecesProduced:null, dateCompleted:null,
    sourceAssignmentId:o.sourceAssignmentId || null,
    earnings:0,
    materialReturned:false, materialReturnDate:null,
  };
  state.assignments.push(a);
  if(o.dept==='cutting' || o.dept==='vendor'){
    const b = state.batches.find(x=>x.id===o.batchId);
    if(b){ b.distributedM = +(b.distributedM + o.qtyIn).toFixed(1); persistBatchDistributed(b); }
  }
  persistAssignment(a);
  return a;
}
function empEarn(a){
  const item = ITEMS.find(i=>i.id===a.item);
  if(!item || a.piecesProduced==null) return 0;
  if(a.dept==='vendor') return a.piecesProduced * item.vendorRate;
  return a.piecesProduced * (item.rates[a.dept]||0);
}
function submitProduction(assignId, materialUsed, piecesProduced){
  const a = state.assignments.find(x=>x.id===assignId);
  if(!a) return;
  a.materialUsed = materialUsed;
  a.piecesProduced = piecesProduced;
  a.status='completed';
  a.dateCompleted = todayStr();
  a.earnings = empEarn(a);
  persistAssignment(a);
}
function forwardAssignment(assignId, toEmployeeId, qty){
  const a = state.assignments.find(x=>x.id===assignId);
  if(!a) return;
  const emp = state.employees.find(e=>e.id===toEmployeeId);
  const dept = DEPTS.find(d=>d.id===a.dept);
  a.status='forwarded';
  persistAssignment(a);
  const next = createAssignment({
    batchId:a.batchId, item:a.item, dept:dept.next, employeeId:toEmployeeId,
    qtyIn: qty, unitIn:'pieces', sourceAssignmentId:a.id
  });
  return next;
}
function markReady(assignId){
  const a = state.assignments.find(x=>x.id===assignId);
  a.status='ready';
  persistAssignment(a);
}
function toggleMaterialReturn(assignId){
  const a = state.assignments.find(x=>x.id===assignId);
  if(!a) return;
  a.materialReturned = true;
  a.materialReturnDate = todayStr();
  toast(L(`Leftover cloth submission recorded for ${state.employees.find(e=>e.id===a.employeeId).name}`, `${state.employees.find(e=>e.id===a.employeeId).name} यांचे उरलेले कापड जमा झाल्याची नोंद केली`));
  render();
}

function deptStats(deptId){
  const list = state.assignments.filter(a=>a.dept===deptId);
  const received = list.reduce((s,a)=> s + (a.unitIn==='pieces'? a.qtyIn : (a.piecesProduced||0)),0);
  const completedList = list.filter(a=>a.status!=='in-progress');
  const completed = completedList.reduce((s,a)=>s+(a.piecesProduced||0),0);
  const pendingCount = list.filter(a=>a.status==='in-progress').length;
  const employees = state.employees.filter(e=>e.dept===deptId);
  return {list, received, completed, pendingCount, employeeCount: employees.length};
}
function totalRawMeters(){ return state.batches.reduce((s,b)=>s+b.meters,0); }
function totalInventoryMeters(){ return +state.batches.reduce((s,b)=>s+batchRemaining(b),0).toFixed(1); }
function materialWithEmployees(){
  return +state.assignments.filter(a=>(a.dept==='cutting'||a.dept==='vendor') && a.status==='in-progress')
    .reduce((s,a)=>s+a.qtyIn,0).toFixed(1);
}
function materialReturnPending(){
  return +state.assignments.filter(a=>(a.dept==='cutting'||a.dept==='vendor') && a.status==='completed' && a.materialUsed!=null && !a.materialReturned)
    .reduce((s,a)=>s+Math.max(0,a.qtyIn-a.materialUsed),0).toFixed(1);
}
function activeProductionCount(){ return state.assignments.filter(a=>a.status==='in-progress').length; }
function completedTodayCount(){ return state.assignments.filter(a=>a.dateCompleted===todayStr()).length; }
function totalPaymentsPending(){
  let sum=0;
  state.employees.forEach(e=>{ sum += empTotals(e.id).pending; });
  return sum;
}
function activeEmployeeCount(){ return state.employees.filter(e=>e.active).length; }
function readyForDeliveryCount(){ return state.assignments.filter(a=>a.status==='ready').reduce((s,a)=>s+(a.piecesProduced||0),0); }

function attentionItems(){
  const items = [];
  state.assignments.filter(a=>(a.dept==='cutting'||a.dept==='vendor') && a.status==='completed' && !a.materialReturned).forEach(a=>{
    const rem = a.qtyIn - a.materialUsed;
    if(rem > 2){
      const emp = state.employees.find(e=>e.id===a.employeeId);
      items.push({level:'amber', text: L(`<b>${emp.name}</b> has ${rem.toFixed(1)} M cloth not yet submitted back`, `<b>${emp.name}</b> यांच्याकडे ${rem.toFixed(1)} M कापड अजून परत जमा केलेले नाही`), tag:a.batchId});
    }
  });
  state.assignments.filter(a=>a.status==='completed' && a.dept!=='packing').forEach(a=>{
    const emp = state.employees.find(e=>e.id===a.employeeId);
    items.push({level:'amber', text: L(`<b>${emp.name}</b> completed ${a.piecesProduced} ${itemName(a.item)} in ${deptName(a.dept)} — not yet forwarded`, `<b>${emp.name}</b> यांनी ${deptName(a.dept)} मध्ये ${a.piecesProduced} ${itemName(a.item)} पूर्ण केले — अजून पुढे पाठवलेले नाही`), tag:a.id});
  });
  state.assignments.filter(a=>a.status==='in-progress').forEach(a=>{
    const days = Math.round((new Date(todayStr()) - new Date(a.dateAssigned)) / 86400000);
    if(days >= 3){
      const emp = state.employees.find(e=>e.id===a.employeeId);
      items.push({level:'red', text: L(`<b>${emp.name}</b> has overdue work in ${deptName(a.dept)} — assigned ${days} days ago`, `<b>${emp.name}</b> यांचे ${deptName(a.dept)} मधील काम रखडले आहे — ${days} दिवसांपूर्वी दिले`), tag:a.id});
    }
  });
  const pendingPay = totalPaymentsPending();
  if(pendingPay>0) items.push({level:'amber', text: L(`${inr(pendingPay)} in employee payments pending across all departments`, `सर्व विभागांत कर्मचाऱ्यांचे ${inr(pendingPay)} देयक बाकी आहे`), tag: L('payroll','पगार')});
  state.batches.forEach(b=>{
    if(batchRemaining(b) < 30) items.push({level:'red', text: L(`<b>${b.clothName}</b> (${b.id}) stock is running low — ${batchRemaining(b).toFixed(1)} M left`, `<b>${b.clothName}</b> (${b.id}) साठा कमी आहे — फक्त ${batchRemaining(b).toFixed(1)} M शिल्लक`), tag:b.id});
  });
  return items;
}

let currentWorkspace = 'internal';

  ]},
  {group:'Materials', items:[
    {id:'materials', label:'Raw Material', icon:'▤'},
    {id:'dress-sizes', label:'Dress Sizes', icon:'📏'},
  ]},
  {group:'Workforce', items:[
    {id:'employees', label:'Employees', icon:'◍'},
    {id:'assign', label:'Assign Work', icon:'➜'},
  ]},
  {group:'Production', items:[
    {id:'production', label:'Production Pipeline', icon:'⛓'},

    {id:'mypassbook', label:'My Passbook', icon:'▦'},
  ]},
];
const EXTERNAL_NAV = [
  {group:'External operations', items:[{id:'external-dashboard', label:'External Dashboard', icon:'↗'}]},
];
const CLIENT_NAV = [
  {group:'Client workspace', items:[{id:'client-dashboard', label:'Client Dashboard', icon:'◌'}]},
];

function route(hash){
  try{ closeSidebar(); }catch(e){}
  if(!hash) hash = currentRole==='employee' ? 'mypassbook' : 'dashboard';
  window.location.hash = hash;
}
window.addEventListener('hashchange', render);

function renderNav(){
  const active = (window.location.hash||'#dashboard').slice(1);
  const nav = currentWorkspace==='external' ? EXTERNAL_NAV : currentWorkspace==='client' ? CLIENT_NAV : (currentRole==='employee' ? EMP_NAV : NAV);
  let html='';
  nav.forEach(g=>{
    html += `<div class="nav-group-label">${tr(g.group)}</div>`;
    g.items.forEach(it=>{
      const isActive = active===it.id || (it.id!=='dashboard' && active.startsWith(it.id));
      const badge = it.badge ? `<span class="nav-badge" data-badge="${it.badge}" ${QUOTE_NEW_COUNT?'':'hidden'}>${QUOTE_NEW_COUNT}</span>` : '';
      html += `<div class="nav-link ${isActive?'active':''}" role="link" tabindex="0" onclick="route('${it.id}')" onkeydown="if(event.key==='Enter'){route('${it.id}')}"><span class="nav-ico">${it.icon}</span>${it.dept ? deptName(it.dept) : tr(it.label)}${badge}</div>`;
    });
  });
  document.getElementById('navlinks').innerHTML = html;
  document.querySelectorAll('.workspace-tab').forEach(tab=>{
    tab.classList.toggle('active', tab.dataset.workspace===currentWorkspace);
    const label = tab.dataset.workspace==='internal'?'Internal': tab.dataset.workspace==='external'?'External':'Client';
    if(tab.dataset.workspace) tab.textContent = tr(label);
  });
  document.getElementById('langBtnEn').classList.toggle('active', LANG==='en');
  document.getElementById('langBtnMr').classList.toggle('active', LANG==='mr');
  document.querySelector('.searchbox input').placeholder = tr('Search employee, batch, order…');
  const dark = document.documentElement.classList.contains('dark-mode');
  const dt = document.getElementById('darkToggle'); if(dt) dt.textContent = dark ? '☀ '+tr('Light') : '☾ '+tr('Dark');
  const so = document.getElementById('signOutLabel'); if(so) so.textContent = tr('Sign out');
  const sb = document.getElementById('signOutBtn'); if(sb) sb.title = tr('Sign out');
  const sf = document.getElementById('sidebarFoot'); if(sf) sf.textContent = tr('Owner workspace');
  const bs = document.querySelector('.brand-sub'); if(bs) bs.textContent = tr('Uniforms & Garments');
  const bell = document.getElementById('quoteBell'); if(bell) bell.classList.toggle('active', active==='notifications');
  document.documentElement.lang = LANG==='mr' ? 'mr' : 'en';
  setQuoteCount(QUOTE_NEW_COUNT);
  translateDom(document.getElementById('topbar'));
}

function switchWorkspace(workspace){
  currentWorkspace = workspace;
  currentRole = 'owner';
  globalSearchQuery = '';
  const input = document.getElementById('globalSearch');
  if(input) input.value = '';
  route(workspace==='internal' ? 'dashboard' : `${workspace}-dashboard`);
}

function onRoleChange(v){
  currentRole = v;

  if(v==='employee'){
    pickEmployeeThenGo();
  } else {

}
function pickEmployeeThenGo(){
  openModal(`
    <div class="modal-head"><h3>View as employee</h3><span class="modal-close" onclick="closeModal()">✕</span></div>
    <div class="modal-body">
      <div class="field"><label>Choose employee</label>
        <select id="pickEmp">${state.employees.filter(e=>e.type==='internal'||e.type==='vendor').map(e=>`<option value="${e.id}">${e.name} — ${e.type==='vendor'?'Vendor':deptName(e.dept)}</option>`).join('')}</select>

    </div>

function confirmPickEmployee(){
  currentEmployeeView = document.getElementById('pickEmp').value;
  closeModal();
  route('mypassbook');
}
let globalSearchQuery = '';
let searchReturnHash = 'dashboard';
function onGlobalSearch(v){
  globalSearchQuery = v.trim();
  if(globalSearchQuery){
    const currentHash = (window.location.hash||'#dashboard').slice(1);
    if(currentHash !== 'search') searchReturnHash = currentHash;
    if(currentHash !== 'search') route('search'); else render();
  } else if((window.location.hash||'').slice(1) === 'search') {
    route(searchReturnHash || 'dashboard');
  }
}

let lastRenderedHash = null;
function render(){
  renderNav();
  RULER_ON_DASHBOARD = false;
  const hash = (window.location.hash||'#dashboard').slice(1);
  if(hash==='notifications' && lastRenderedHash!=='notifications') loadNotifications();
  if(hash!=='notifications' && lastRenderedHash==='notifications') NOTIF.sessionNewIds = [];
  lastRenderedHash = hash;
  const c = document.getElementById('content');
  if(currentRole==='employee'){
    c.innerHTML = viewEmployeeDetail(currentEmployeeView, true);
    translateDom(c);
    syncRulerTab();
    return;
  }
  if(hash==='search') c.innerHTML = viewSearch();
  else if(hash==='external-dashboard') c.innerHTML = viewExternalDashboard();
  else if(hash==='client-dashboard') c.innerHTML = viewClientDashboard();
  else if(hash==='dashboard') c.innerHTML = viewDashboard();
  else if(hash==='notifications') c.innerHTML = viewNotifications();
  else if(hash==='materials') c.innerHTML = viewMaterials();
  else if(hash.startsWith('materials-')) c.innerHTML = viewBatchDetail(hash.replace('materials-',''));
  else if(hash==='dress-sizes') c.innerHTML = viewDressSizes();
  else if(hash==='employees') c.innerHTML = viewEmployees();
  else if(hash.startsWith('emp-')) c.innerHTML = viewEmployeeDetail(hash.replace('emp-',''), false);
  else if(hash==='assign') c.innerHTML = viewAssignWork();
  else if(hash==='production') c.innerHTML = viewProductionPipeline();
  else if(hash.startsWith('dept-')) c.innerHTML = viewDepartment(hash.replace('dept-',''));
  else if(hash==='payments') c.innerHTML = viewPayments();
  else if(hash==='ratecard') c.innerHTML = viewRateCard();
  else c.innerHTML = viewDashboard();
  translateDom(c);
  syncRulerTab();
}

function selectSearchResult(destination){
  globalSearchQuery = '';
  const input = document.getElementById('globalSearch');
  if(input) input.value = '';
  route(destination);
}

function viewSearch(){
  const query = globalSearchQuery.toLowerCase();
  const matches = [];
  const add = (type, title, detail, destination, value) => {
    if(value.toLowerCase().includes(query)) matches.push({type, title, detail, destination});
  };

  state.employees.forEach(e => add(
    'Employee', e.name, `${e.id} · ${e.type==='vendor' ? 'Vendor' : deptName(e.dept)}`, `emp-${e.id}`,
    `${e.name} ${e.id} ${e.type} ${deptName(e.dept)}`
  ));
  state.batches.forEach(b => add(
    'Raw material', `${b.id} — ${b.clothName}`, `${b.supplier} · Bill ${b.billNo}`, `materials-${b.id}`,
    `${b.id} ${b.clothName} ${b.supplier} ${b.billNo}`
  ));
  state.assignments.forEach(a => {
    const employee = state.employees.find(e => e.id===a.employeeId);
    add('Work order', `${a.id} — ${itemName(a.item)}`, `${a.batchId} · ${employee ? employee.name : deptName(a.dept)} · ${tr(a.status)}`, `dept-${a.dept}`,
      `${a.id} ${a.batchId} ${itemName(a.item)} ${deptName(a.dept)} ${employee ? employee.name : ''} ${a.status}`);
  });
  NAV.flatMap(group => group.items).forEach(item => add(
    'Page', item.dept ? deptName(item.dept) : tr(item.label), tr('Open this section'), item.id,
    `${item.label} ${item.dept ? deptName(item.dept) : ''} ${item.group || ''}`
  ));

  const results = matches.slice(0, 30).map(result => `
    <button class="search-result" onclick="selectSearchResult('${result.destination}')">
      <div class="search-result-type">${tr(result.type)}</div>
      <div class="search-result-title">${result.title}</div>
      <div class="search-result-detail">${result.detail}</div>
    </button>`).join('');
  return `<div class="page-head"><div><h1 class="page-title">${tr('Search results')}</h1><p class="page-sub">${tr('Results for')} “${globalSearchQuery}”</p></div></div>
    <div class="search-results">${results || `<div class="panel panel-pad empty">${tr('No results found. Try an employee name, batch ID, supplier, item, work-order ID, or page name.')}</div>`}</div>`;
}

/* ============================================================
   MODAL + TOAST HELPERS
============================================================ */
function openModal(html){
  document.getElementById('modalRoot').innerHTML = `<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
  translateDom(document.getElementById('modalRoot'));
}
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = trText(String(msg)); t.classList.add('show');
  clearTimeout(window._toastT);
  window._toastT = setTimeout(()=>t.classList.remove('show'), 2400);
}

function viewExternalDashboard(){
  const jobs = state.assignments.filter(a=>a.dept==='vendor').slice().reverse();
  const clothIssued = jobs.reduce((sum,a)=>sum+a.qtyIn,0);
  const clothUsed = jobs.reduce((sum,a)=>sum+(a.materialUsed||0),0);
  const finalised = jobs.reduce((sum,a)=>sum+(a.earnings||0),0);
  const rows = jobs.map(a=>{
    const agent = state.employees.find(e=>e.id===a.employeeId);
    const status = a.status==='in-progress' ? '<span class="badge badge-amber">In progress</span>' : '<span class="badge badge-green">Finalised</span>';
    return `<tr>
      <td><span class="tbl-name">${agent ? agent.name : 'External agent'}</span><br><span class="tbl-sub mono">${a.id}</span></td>
      <td><span class="tbl-name mono">${a.batchId}</span><br><span class="tbl-sub">${itemName(a.item)}</span></td>
      <td>${a.qtyIn} M</td>
      <td>${a.materialUsed!=null ? `${a.materialUsed} M` : 'Not submitted'}</td>
      <td>${a.piecesProduced!=null ? `${a.piecesProduced} pcs` : 'Awaiting completion'}</td>
      <td>${a.earnings ? inr(a.earnings) : 'Not finalised'}</td>
      <td>${status}</td>
    </tr>`;
  }).join('');
  return `
  <div class="page-head">
    <div><h1 class="page-title">${tr('External Dashboard')}</h1><p class="page-sub">${tr('Cloth issued to external agents, production progress, and finalised amounts.')}</p></div>
    <button class="btn btn-primary" onclick="route('assign')">${tr('Assign external work')}</button>
  </div>
  <div class="kpi-grid" style="grid-template-columns:repeat(4,1fr);margin-bottom:22px;">
    <div class="kpi-card"><div class="kpi-label">External agents</div><div class="kpi-value">${state.employees.filter(e=>e.type==='vendor').length}</div><div class="kpi-delta flat">Active partners</div></div>
    <div class="kpi-card"><div class="kpi-label">Cloth issued</div><div class="kpi-value">${clothIssued.toFixed(1)}<span class="unit">M</span></div><div class="kpi-delta flat">Across external work</div></div>
    <div class="kpi-card"><div class="kpi-label">Cloth used</div><div class="kpi-value">${clothUsed.toFixed(1)}<span class="unit">M</span></div><div class="kpi-delta up">Reported by agents</div></div>
    <div class="kpi-card"><div class="kpi-label">Finalised amount</div><div class="kpi-value">${inr(finalised)}</div><div class="kpi-delta warn">Completed external work</div></div>
  </div>
  <div class="panel"><div style="overflow-x:auto;"><table>
    <tr><th>External agent</th><th>Batch & item</th><th>Cloth taken</th><th>Cloth used</th><th>Finished quantity</th><th>Final amount</th><th>Status</th></tr>
    ${rows || '<tr><td colspan="7" class="empty">No external work has been assigned yet.</td></tr>'}
  </table></div></div>`;
}

/* ============================================================
   VIEW: DRESS SIZES — garment size charts (shirt, pant, pinaco, ...)
   Stored server-side via /api/size-charts (whole-chart upserts). This browser also keeps its
   last saved copy so edits survive a fresh/ephemeral server instance (re-synced on load).
============================================================ */
const SIZE_CACHE_KEY = 'threadline_size_charts_v1';
const SIZES = { charts:null, loading:false, error:'', active:null, backend:'' };
const SIZE_FIELD_LABELS = {
  chest:['Chest','छाती'], waist:['Waist','कंबर'], hip:['Hip','हिप'], length:['Length','लांबी'],
  shoulder:['Shoulder','खांदा'], sleeve:['Sleeve','बाही'], collar:['Collar','कॉलर'], inseam:['Inseam','आतील लांबी'],
  bottom:['Bottom','मोहरी'], strap:['Strap','पट्टा'], neck:['Neck','गळा'], armhole:['Armhole','आर्महोल'], thigh:['Thigh','मांडी']
};
const SIZE_FIELD_PRESETS = ['chest','waist','hip','length','shoulder','sleeve','collar','inseam','bottom','strap','neck','armhole','thigh'];
const GARMENT_NAME_MR = { 'Shirt':'शर्ट','Pant':'पँट','Skirt':'स्कर्ट','Pinaco':'पिनॅको','Grammer':'ग्रामर','Half Hastin':'हाफ हस्तीन','Bandi':'बंडी' };
const SIZE_BASIS_MR = { 'Chest (in)':'छाती (इंच)','Waist (in)':'कंबर (इंच)','Age':'वय' };
const SIZE_NOTES_MR = {
  'Half sleeve uses the sleeve column; full sleeve add ~14 in.':'हाफ स्लीव्हसाठी बाहीचा कॉलम; फुल स्लीव्हसाठी ~14 इंच जोडा.',
  'Lengths can be changed per school.':'शाळेनुसार लांबी बदलता येते.',
  'Pinafore dress — wear over the uniform shirt.':'पिनॅफोर ड्रेस — युनिफॉर्म शर्टवर घालायचा.',
  'Dungaree style — length is shoulder to hem.':'डंगरी स्टाइल — लांबी खांद्यापासून खालच्या टोकापर्यंत.',
  'Nehru-style waistcoat.':'नेहरू-स्टाइल जॅकेट.'
};
function sizeFieldLabel(f){ const l=SIZE_FIELD_LABELS[f]; if(l) return LANG==='mr'?l[1]:l[0]; return String(f).replace(/_/g,' ').replace(/^./,c=>c.toUpperCase()); }
function garmentName(c){ return LANG==='mr' ? (GARMENT_NAME_MR[c.name]||c.name) : c.name; }
function readSizeCache(){ try{ const c=JSON.parse(localStorage.getItem(SIZE_CACHE_KEY)||'{}'); c.charts=c.charts||{}; c.deleted=c.deleted||{}; return c; }catch(e){ return {charts:{},deleted:{}}; } }
function writeSizeCache(c){ try{ localStorage.setItem(SIZE_CACHE_KEY, JSON.stringify(c)); }catch(e){} }
function rememberChart(chart){ const c=readSizeCache(); c.charts[chart.id]=chart; delete c.deleted[chart.id]; writeSizeCache(c); }
function rememberDeletedChart(id){ const c=readSizeCache(); delete c.charts[id]; c.deleted[id]=Date.now(); writeSizeCache(c); }
function sortCharts(list){ return list.slice().sort((a,b)=>(a.position??999)-(b.position??999) || String(a.name).localeCompare(String(b.name))); }
function fmtMeasure(v){ if(v==null || v==='') return '<span class="sz-empty">—</span>'; const n=Number(v); return Number.isInteger(n) ? String(n) : String(n).replace(/\.5$/,'½').replace(/\.25$/,'¼').replace(/\.75$/,'¾'); }

async function loadSizeCharts(){
  if(SIZES.loading) return;
  SIZES.loading = true; SIZES.error = '';
  try{
    const d = await api('/api/size-charts');
    SIZES.backend = d.backend || '';
    const byId = {}; (d.charts||[]).forEach(c=>{ byId[c.id]=c; });
    const cache = readSizeCache();
    Object.keys(cache.deleted).forEach(id=>{
      if(byId[id]){ delete byId[id]; api('/api/size-charts/'+encodeURIComponent(id),{method:'DELETE'}).catch(()=>{}); }
    });
    for(const local of Object.values(cache.charts)){
      const srv = byId[local.id];
      if(!srv || Date.parse(srv.updatedAt||0) < Date.parse(local.updatedAt||0)){
        try{ const r = await api('/api/size-charts/'+encodeURIComponent(local.id),{method:'PUT',body:JSON.stringify({...local,resync:true})}); byId[local.id]=r.chart; }
        catch(e){ byId[local.id]=local; }
      }
    }
    SIZES.charts = sortCharts(Object.values(byId));
  }catch(err){
    SIZES.error = err.message || 'Error';
    const cache = readSizeCache();
    if(!SIZES.charts && Object.keys(cache.charts).length) SIZES.charts = sortCharts(Object.values(cache.charts));
  }finally{
    SIZES.loading = false;
    if(SIZES.charts && (!SIZES.active || !SIZES.charts.find(c=>c.id===SIZES.active))) SIZES.active = SIZES.charts[0] ? SIZES.charts[0].id : null;
    if((location.hash||'').slice(1)==='dress-sizes') render();
  }
}
async function saveChart(chart){
  const r = await api('/api/size-charts/'+encodeURIComponent(chart.id),{method:'PUT',body:JSON.stringify(chart)});
  const saved = r.chart;
  rememberChart(saved);
  const i = SIZES.charts.findIndex(c=>c.id===saved.id);
  if(i>=0) SIZES.charts[i]=saved; else SIZES.charts.push(saved);
  SIZES.charts = sortCharts(SIZES.charts);
  return saved;
}

async function saveSizeRow(chartId, idx){
  const c = (SIZES.charts||[]).find(x=>x.id===chartId); if(!c) return;
  const err = document.getElementById('szErr');
  const size = (document.getElementById('szf__size').value||'').trim();
  if(!size){ err.textContent = L('Please enter a size label.','कृपया साइज लेबल लिहा.'); return; }
  const dup = (c.rows||[]).findIndex(r=>String(r.size).toLowerCase()===size.toLowerCase());
  if(dup>=0 && dup!==idx){ err.textContent = L('That size already exists in this chart.','ही साइज या चार्टमध्ये आधीच आहे.'); return; }
  const row = { size };
  for(const f of (c.fields||[])){
    const v = document.getElementById('szf_'+f).value;
    if(v==='') continue;
    const n = Number(v);
    if(!Number.isFinite(n) || n<0 || n>=1000){ err.textContent = L('Measurements must be numbers between 0 and 999.','मापे 0 ते 999 मधील संख्या असावीत.'); return; }
    row[f] = n;
  }
  const rows = (c.rows||[]).slice();
  if(Number.isInteger(idx)) rows[idx] = row; else rows.push(row);
  const btn = document.getElementById('szSaveBtn'); if(btn){ btn.disabled = true; btn.textContent = L('Saving…','जतन होत आहे…'); }
  try{
    await saveChart({ ...c, rows });
    closeModal(); render();
    toast(Number.isInteger(idx) ? L('Size updated','साइज अपडेट झाली') : L('Size added','साइज जोडली'));
  }catch(e){ err.textContent = e.message || 'Error'; if(btn){ btn.disabled=false; btn.textContent=L('Save size','साइज जतन करा'); } }
}

async function saveChartModal(chartId){
  const err = document.getElementById('szErr');
  const name = (document.getElementById('szc_name').value||'').trim();
  if(!name){ err.textContent = L('Please enter a garment name.','कृपया कपड्याचे नाव लिहा.'); return; }
  const picked = [...document.querySelectorAll('.sz-checks input:checked')].map(i=>i.value);
  const custom = (document.getElementById('szc_custom').value||'').split(',').map(s=>s.trim().toLowerCase().replace(/\s+/g,'_')).filter(s=>/^[a-z][a-z0-9_]{0,23}$/.test(s) && s!=='size');
  const fields = Array.from(new Set([...picked, ...custom])).slice(0,12);
  const existing = chartId ? SIZES.charts.find(x=>x.id===chartId) : null;
  let id = chartId;
  if(!id){
    const base = (name.toLowerCase().normalize('NFKD').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'') || 'garment').slice(0,30);
    id = base; let n = 2; while(SIZES.charts.find(x=>x.id===id) || readSizeCache().deleted[id]) id = `${base}-${n++}`;
  }
  const chart = { id, name, basis:(document.getElementById('szc_basis').value||'').trim(), notes:(document.getElementById('szc_notes').value||'').trim(), fields,
    rows: existing ? existing.rows : [], position: existing ? existing.position : (SIZES.charts.length + 100) };
  const btn = document.getElementById('szSaveBtn'); if(btn){ btn.disabled = true; btn.textContent = L('Saving…','जतन होत आहे…'); }
  try{
    await saveChart(chart);
    SIZES.active = id; closeModal(); render();
    toast(existing ? L('Garment updated','कपडा अपडेट झाला') : L('Garment added','कपडा जोडला'));
  }catch(e){ err.textContent = e.message || 'Error'; if(btn){ btn.disabled=false; btn.textContent=L('Save garment','कपडा जतन करा'); } }
}

function filterSupplierMenu(q){
  const menu=document.getElementById('supplierMenu'); if(!menu) return;
  const query=(q||'').trim().toLowerCase();
  const matches=SUPPLIERS.filter(s=>!query || s.toLowerCase().includes(query));
  let h=matches.map(s=>{
    const safe=String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
    return '<div class="combo-option" data-name="'+safe+'" onmousedown="event.preventDefault();selectSupplier(this.dataset.name)">'+safe+'</div>';
  }).join('');
  if(!matches.length) h='<div class="combo-empty">'+tr('No matching companies')+'</div>';
  if(query && !SUPPLIERS.some(s=>s.toLowerCase()===query)){
    h+='<div class="combo-add" onmousedown="event.preventDefault();addSupplierFromInput()">'+tr('＋ Add company')+': "'+query.replace(/</g,'&lt;')+'"</div>';
